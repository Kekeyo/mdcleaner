<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown 公式清洗</title>
<link rel="stylesheet" href="./katex/katex.min.css">
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1d2430;--mute:#677084;--line:#dde1e8;--acc:#2f6fed;--ok:#1a8a4a;--warn:#b25e00;--bad:#c62828}
  @media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d222a;--ink:#e6e9ef;--mute:#98a1b3;--line:#2e3541;--acc:#6b9bff;--ok:#4cc884;--warn:#f0a030;--bad:#ff7b72}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}
  /* 页面拉满与宽屏自适应 */
  main{max-width:100%;margin:0 auto;padding:12px 20px 60px;box-sizing:border-box}
  .app-hdr{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px}
  .app-title-group{display:flex;align-items:center;gap:10px}
  .app-hdr h1{font-size:20px;margin:0}
  .app-hdr .sub{color:var(--mute);margin:0;font-size:12.5px}
  .layout-switcher{display:inline-flex;align-items:center;background:var(--card,#fff);border:1px solid var(--line,#dde1e8);border-radius:10px;padding:3px;gap:3px;box-shadow:0 1px 3px rgba(0,0,0,.04);user-select:none}
  .layout-btn{font:inherit;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:7px;border:none;background:transparent;color:var(--mute,#677084);cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .15s;white-space:nowrap}
  .layout-btn:hover{color:var(--ink,#1d2430);background:rgba(99,102,241,.06)}
  .layout-btn.active{background:var(--acc,#2f6fed);color:#fff;box-shadow:0 2px 6px rgba(47,111,237,.25)}

  /* 核心网格容器与区域映射 */
  #zoneContainer{display:grid;gap:14px;align-items:start;width:100%;box-sizing:border-box}
  #sec-file{grid-area:file;margin:0!important;min-width:0}
  #sec-md{grid-area:md;margin:0!important;min-width:0}
  #sec-fix{grid-area:fix;margin:0!important;min-width:0}
  #zone-editor{grid-area:edit;margin:0!important;min-width:0}
  #sec-render{grid-area:render;margin:0!important;min-width:0}

  /* 布局模式 1：左右对半工作台 —— 严格 50%:50% 对半平分，全模块像素级等高对齐 */
  html.layout-workstation #zoneContainer,body.layout-workstation #zoneContainer{
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-rows: 1fr 1fr auto;
    grid-template-areas:
      "file   edit"
      "fix    edit"
      "md     render";
    align-items: stretch;
  }
  /* 工作台首排：左侧文件区与修复统计在垂直方向各占一半（1:1严格平分），右侧编辑区田字格全高平齐 */
  body.layout-workstation #zone-editor{
    height:100%;
    display:flex;
    flex-direction:column;
    box-sizing:border-box;
  }
  body.layout-workstation #zone-editor>.zb2{
    flex:1;
    display:flex;
    flex-direction:column;
  }
  body.layout-workstation #editor{
    flex:1;
    margin-bottom:0;
  }
  body.layout-workstation #sec-file{
    height:100%;
    display:flex;
    flex-direction:column;
    box-sizing:border-box;
  }
  body.layout-workstation #sec-file>.zb2{
    flex:1;
    display:flex;
    flex-direction:column;
  }
  body.layout-workstation #sec-file-in{
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    box-sizing:border-box;
  }
  body.layout-workstation #sec-file #drop{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100px;
  }
  body.layout-workstation #sec-fix{
    height:100%;
    display:flex;
    flex-direction:column;
    box-sizing:border-box;
  }
  body.layout-workstation #sec-fix>.zb2{
    flex:1;
    display:flex;
    flex-direction:column;
  }
  body.layout-workstation #sec-fix-in{
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column;
    box-sizing:border-box;
  }
  body.layout-workstation #sec-fix-in.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    flex:1;
  }
  body.layout-workstation #sec-fix-in>.card{
    height:100%;
    margin-bottom:0;
    display:flex;
    flex-direction:column;
    box-sizing:border-box;
  }
  body.layout-workstation #stats,
  body.layout-workstation #removedDrafts{
    flex:1;
  }

  /* 工作台二排：左侧MD区与右侧渲染区等高平齐 */
  body.layout-workstation #sec-md,
  body.layout-workstation #sec-render{
    height:100%;
    display:flex;
    flex-direction:column;
    box-sizing:border-box;
  }
  body.layout-workstation #sec-md>.zb2,
  body.layout-workstation #sec-render>.zb2{
    flex:1;
    display:flex;
    flex-direction:column;
  }
  body.layout-workstation #sec-md-in,
  body.layout-workstation #sec-render-in{
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column;
    box-sizing:border-box;
  }
  body.layout-workstation #sec-md-in.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    flex:1;
  }
  body.layout-workstation #sec-md-in>.card{
    height:100%;
    margin-bottom:0;
    display:flex;
    flex-direction:column;
    box-sizing:border-box;
  }
  body.layout-workstation #src,
  body.layout-workstation #dst{
    flex:1;
    height:560px;
    min-height:480px;
  }
  body.layout-workstation #prev{
    height:560px;
    max-height:560px;
    overflow-y:auto;
    overflow-x:hidden;
    box-sizing:border-box;
  }

  /* 布局模式 2 (默认推荐)：模块对半仪表盘 —— 首排左修复统计、右文件区等高并排；二排左渲染区、右编辑区等高并排；三排MD区独占整屏全宽 */
  html.layout-dashboard #zoneContainer,body.layout-dashboard #zoneContainer{
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-areas:
      "fix      file"
      "render   edit"
      "md       md";
    align-items: stretch;
  }
  /* 首排左右等高拉齐：左侧修复统计与右侧文件区高度完全一致 */
  body.layout-dashboard #sec-file,
  body.layout-dashboard #sec-fix{
    height:100%;
    display:flex;
    flex-direction:column;
    box-sizing:border-box;
  }
  body.layout-dashboard #sec-file>.zb2,
  body.layout-dashboard #sec-fix>.zb2{
    flex:1;
    display:flex;
    flex-direction:column;
  }
  body.layout-dashboard #sec-file-in,
  body.layout-dashboard #sec-fix-in{
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column;
    box-sizing:border-box;
  }
  body.layout-dashboard #sec-fix-in.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    flex:1;
  }
  body.layout-dashboard #sec-fix-in>.card{
    height:100%;
    margin-bottom:0;
    display:flex;
    flex-direction:column;
    box-sizing:border-box;
  }
  body.layout-dashboard #stats,
  body.layout-dashboard #removedDrafts{
    flex:1;
  }

  /* 二排左渲染区、右编辑区等高拉齐 */
  body.layout-dashboard #sec-render,
  body.layout-dashboard #zone-editor{
    height:100%;
    display:flex;
    flex-direction:column;
    box-sizing:border-box;
  }
  body.layout-dashboard #sec-render>.zb2,
  body.layout-dashboard #zone-editor>.zb2{
    flex:1;
    display:flex;
    flex-direction:column;
  }
  body.layout-dashboard #sec-render-in,
  body.layout-dashboard #editor{
    flex:1;
    margin-bottom:0;
    display:flex;
    flex-direction:column;
    box-sizing:border-box;
  }
  body.layout-dashboard #prev{
    height:640px;
    max-height:640px;
    overflow-y:auto;
    overflow-x:hidden;
    box-sizing:border-box;
  }

  /* 无论在任何并排布局模式下，折叠状态的区（.zone.collapsed）必须彻底释放高度与拉伸约束，紧凑收拢为标题条，绝无大片空白 */
  .zone.collapsed,
  body.layout-dashboard .zone.collapsed,
  body.layout-workstation .zone.collapsed,
  body.layout-dashboard #sec-file.collapsed,
  body.layout-dashboard #sec-fix.collapsed,
  body.layout-dashboard #sec-render.collapsed,
  body.layout-dashboard #zone-editor.collapsed,
  body.layout-dashboard #sec-md.collapsed,
  body.layout-workstation #sec-file.collapsed,
  body.layout-workstation #sec-fix.collapsed,
  body.layout-workstation #sec-render.collapsed,
  body.layout-workstation #zone-editor.collapsed,
  body.layout-workstation #sec-md.collapsed {
    height: auto !important;
    min-height: 0 !important;
    max-height: none !important;
    align-self: start !important;
    flex: 0 0 auto !important;
  }
  .zone.collapsed > .zb2 {
    display: none !important;
  }
  /* 当全部区都处于折叠状态时，取消固定行高拉伸，紧凑整齐排列 */
  html.all-zones-collapsed #zoneContainer,
  body.all-zones-collapsed #zoneContainer {
    grid-template-rows: auto auto auto !important;
    align-items: start !important;
  }
  html.layout-workstation.all-zones-collapsed #zoneContainer,
  body.layout-workstation.all-zones-collapsed #zoneContainer {
    grid-template-areas:
      "file   edit"
      "fix    render"
      "md     md" !important;
  }

  /* 窄屏响应式退化 (<1080px) */
  @media (max-width: 1080px) {
    #zoneContainer{display:flex!important;flex-direction:column!important}
  }

  h1{font-size:20px;margin:0 0 4px} .sub{color:var(--mute);margin:0 0 16px;font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  #drop{border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--mute);cursor:pointer}
  #drop.over{border-color:var(--acc);color:var(--acc)}
  .opts{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0 0;font-size:14px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
  button{font:inherit;padding:7px 16px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  button:disabled{opacity:.45;cursor:default}
  textarea{width:100%;height:480px;min-height:260px;font:13px/1.5 Consolas,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px} @media(max-width:800px){.grid{grid-template-columns:1fr}}
  h2{font-size:15px;margin:0 0 8px}
  .stat{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--line)}
  .stat b{font-variant-numeric:tabular-nums}
  #stats,#removedDrafts{max-height:300px;overflow-y:auto}
  #removedDrafts ul{margin:0;padding-left:18px}
  #removedDrafts li{margin:5px 0;line-height:1.5;word-break:break-all;font-size:13.5px}
  .rem-h{color:var(--acc);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px;margin-right:4px}
  .rem-h:hover{opacity:.8}
  ul{margin:4px 0 0;padding-left:20px} li{margin:2px 0;word-break:break-all}
  .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad);font-weight:600;padding:1px 4px;border-radius:4px;cursor:pointer}
  .bad-jump-focus{animation:badFocusPulse 2.4s cubic-bezier(0.2,0.8,0.2,1) forwards}
  @keyframes badFocusPulse{
    0%{background:#fee2e2;box-shadow:0 0 0 3px #ef4444,0 4px 14px rgba(239,68,68,.45)}
    65%{background:#fee2e2;box-shadow:0 0 0 2px #ef4444,0 2px 8px rgba(239,68,68,.25)}
    100%{background:rgba(239,68,68,.12);box-shadow:none}
  }
  /* 渲染区顶部“N 题有公式错误 ▶”逐题跳转按钮组件 */
  .err-nav-wrap{display:inline-flex;align-items:center;gap:5px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.32);padding:1px 4px 1px 8px;border-radius:999px;color:var(--bad,#c62828);font-weight:600;font-size:12.5px;line-height:1.3;vertical-align:middle;cursor:pointer;user-select:none;transition:background .15s,border-color .15s,box-shadow .15s}
  .err-nav-wrap:hover{background:rgba(239,68,68,.16);border-color:rgba(239,68,68,.55);box-shadow:0 2px 6px rgba(239,68,68,.15)}
  .err-nav-wrap .err-step{font-size:11.5px;opacity:.88;font-variant-numeric:tabular-nums;margin-left:2px}
  .err-next-btn{width:20px;height:20px;padding:0;border-radius:50%;border:none;background:var(--bad,#c62828);color:#fff;font-size:10px;line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s,background .15s,box-shadow .15s;flex:none;box-shadow:0 1px 3px rgba(198,40,40,.3)}
  .err-next-btn:hover{background:#b71c1c;transform:translateX(1px) scale(1.08);box-shadow:0 2px 6px rgba(198,40,40,.45)}
  .err-next-btn:active{transform:scale(.94)}
  #prev{position:relative;max-height:640px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--bg)}
  #prev .q{margin:0 0 14px;padding:6px 10px 10px;border-bottom:1px solid var(--line);border-radius:8px;transition:background-color .3s,box-shadow .3s}
  #prev .q.q-jump-target{animation:qJumpTargetAnim 2.2s cubic-bezier(0.2,0.8,0.2,1) forwards}
  @keyframes qJumpTargetAnim{
    0%{background:rgba(99,102,241,.24);box-shadow:0 0 0 3px #6366f1,0 4px 18px rgba(99,102,241,.35)}
    60%{background:rgba(99,102,241,.12);box-shadow:0 0 0 3px #6366f1,0 4px 12px rgba(99,102,241,.2)}
    100%{background:transparent;box-shadow:none}
  }
  #prev .q h1,#edPrev h1{margin:10px 0 6px;font-size:18px;color:var(--ink);font-weight:700}
  #prev .q h2,#edPrev h2{margin:8px 0 5px;font-size:16px;color:var(--ink);font-weight:600}
  #prev .q h3,#edPrev h3{margin:6px 0 4px;font-size:15px;color:var(--ink);font-weight:600}
  #prev .q h4,#edPrev h4{margin:5px 0 3px;font-size:14px;color:var(--ink);font-weight:600}
  #prev .q h5,#edPrev h5,#prev .q h6,#edPrev h6{margin:4px 0 2px;font-size:13.5px;color:var(--ink);font-weight:600}
  .md-heading{scroll-margin-top:20px;border-radius:6px;transition:background-color .3s,box-shadow .3s}
  .md-heading.q-jump-target{animation:qJumpTargetAnim 2.2s cubic-bezier(0.2,0.8,0.2,1) forwards}
  #prev p,#edPrev p{margin:4px 0;white-space:pre-wrap}
  .hint{color:var(--mute);font-size:13px}
  /* 标题排版：h2 里的小灰字别跟着变粗（雅黑加粗发闷）；面板标题给层次 */
  h2 .hint{font-weight:400}
  .eh>.hint:first-child{color:var(--ink);font-size:14px;font-weight:600;letter-spacing:.2px;display:inline-flex;align-items:center;gap:7px}
  .eh>.hint:first-child::before{content:'';width:3px;height:13px;border-radius:2px;background:var(--acc);flex:none}
  #edTitle,#edPrevNo{color:var(--mute);font-weight:400;font-size:12.5px}
  .zone>.zh .zt{font-weight:600;letter-spacing:.2px}
  #issues{margin-top:4px}
  .item{padding:5px 6px;border-bottom:1px dashed var(--line);font-size:14px;cursor:pointer;border-radius:6px;transition:background-color .15s,box-shadow .15s}
  .item:hover{background:rgba(99,102,241,.07)}
  .item.editing-cur{background:rgba(47,111,237,.12);box-shadow:inset 3px 0 0 var(--acc,#2f6fed)}
  .item.done{opacity:.6} .item.done b{text-decoration:line-through}
  .item label,.item .ck{cursor:pointer} .item .why{cursor:pointer}
  .item .snap{width:26px;height:26px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
  .item .snap svg{display:block} .item .snap:disabled{opacity:.45}
  .warn-sec{margin-top:6px}
  .warn-sec-hd{color:var(--warn);font-size:13.5px;padding:4px 6px 2px}
  .item.warn-item{color:var(--warn)}
  .item.warn-item .warn-txt{color:var(--warn);font-weight:600}
  .item.done .btn-quick-new{opacity:1}
  .hdrr{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
  /* 核对栏顶部的题号搜索/调出放大镜组件 */
  .chk-search{position:relative;display:inline-flex;align-items:center;gap:4px;background:var(--card,#fff);border:1px solid var(--line,#dde1e8);border-radius:9px;padding:2px 6px 2px 8px;font:inherit;font-size:13px;color:var(--ink,#1d2430);cursor:default;user-select:none;transition:border-color .15s,box-shadow .15s,width .2s;box-sizing:border-box;width:145px;max-width:100%;height:28px}
  .chk-search:hover,.chk-search:focus-within{border-color:#6366f1;box-shadow:0 0 0 2px rgba(99,102,241,.12);width:165px}
  .chk-search.shake{animation:chkSearchShake .35s ease;border-color:#ef4444!important}
  @keyframes chkSearchShake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
  .chk-search .chk-search-ic{display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:#6366f1;cursor:pointer;line-height:1;transition:transform .15s;flex:none}
  .chk-search .chk-search-ic:hover{transform:scale(1.15)}
  .chk-search .chk-search-in{border:none;outline:none;background:transparent;font-family:inherit;font-size:12px;color:var(--ink,#1d2430);flex:1;min-width:0;padding:0}
  .chk-search .chk-search-in::placeholder{color:var(--mute,#94a3b8);font-size:11.5px}
  .chk-search .chk-search-clear{display:none;border:none;background:#f1f5f9;color:#64748b;border-radius:50%;width:15px;height:15px;font-size:11px;line-height:1;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:none;transition:background .15s}
  .chk-search .chk-search-clear:hover{background:#e2e8f0;color:#1e293b}
  .chk-search.has-val .chk-search-clear{display:inline-flex}
  .chk-search .chk-search-go{border:none;background:#e0e7ff;color:#4338ca;border-radius:5px;padding:1px 6px;font-size:11px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;line-height:1.2;flex:none;transition:background .15s,color .15s}
  .chk-search .chk-search-go:hover{background:#6366f1;color:#fff}
  .chk-search-drop{position:absolute;top:calc(100% + 5px);right:0;width:270px;max-height:280px;overflow-y:auto;background:var(--card,#fff);border:1px solid var(--line,#dde1e8);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);z-index:100;padding:4px;display:none;flex-direction:column;gap:2px}
  .chk-search-drop.on{display:flex}
  .chk-search-item{display:flex;align-items:center;justify-content:space-between;padding:5px 9px;border-radius:6px;font-size:12px;color:var(--ink,#1d2430);cursor:pointer;transition:background .12s}
  .chk-search-item:hover,.chk-search-item.active{background:rgba(99,102,241,.1);color:#4338ca;font-weight:600}
  .chk-search-item .q-tag{font-size:11px;color:var(--mute,#94a3b8)}
  .chk-search-item.bad .q-tag{color:#dc2626;font-weight:600}
  .chk-search-item.done .q-tag{color:#15803d;font-weight:600}
  .chk-search-item.new-q{background:rgba(99,102,241,.06);color:#4338ca;border:1px dashed #c7d2fe;margin-bottom:3px}
  .chk-search-item.new-q:hover,.chk-search-item.new-q.active{background:#e0e7ff;color:#3730a3;border-color:#818cf8}
  .chk-search-tip{padding:6px 8px;font-size:11.5px;color:var(--mute,#94a3b8);text-align:center}

  #ordAll{width:28px;height:28px;padding:0;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:border-color .15s,color .15s,background-color .15s;flex:none}
  #ordAll:hover{border-color:var(--acc);color:var(--acc);background:rgba(99,102,241,.06)}
  #ordAll svg{display:block}
  #ordMsg{font-size:12px;color:var(--mute)}
  .item.done .go,.item.done .up{opacity:1}   /* 核对过的题也能点进去看，按钮不跟着变灰 */
  #prev .q{content-visibility:auto;contain-intrinsic-size:auto 220px}   /* 屏外的题先不排版，滚动更顺 */
  .cnt{font-size:12px;line-height:1;padding:3px 10px;border-radius:11px;background:#fee2e2;color:#991b1b;font-weight:600;white-space:nowrap}
  .cnt:empty{display:none} .cnt.ok{background:#dcfce7;color:#166534}
  #edCheck{min-width:0;width:100%;box-sizing:border-box} #todo{height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--bg)}
  .item .why{color:var(--mute);font-size:12.5px;margin-left:26px;word-break:break-all}
  .item button{padding:1px 10px;font-size:13px;margin-left:6px}
  #edImg{position:relative;height:300px;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mute);cursor:pointer;overflow:hidden;background:var(--bg);outline:none;min-width:0;box-sizing:border-box}
  #edImg:hover,#edImg:focus,#edImg.over{border-color:var(--acc);color:var(--acc)} #edImg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff} #edImg.has #edImgHint{display:none}

  /* 编辑区四窗口严格固定2x2网格 (田字格)，控件多了在标题栏自动换行，绝不破坏网格 */
  #editor .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
  #editor .grid>div{min-width:0;width:100%;box-sizing:border-box}

  #editor .eh{display:flex;align-items:center;justify-content:space-between;gap:6px 10px;margin-bottom:6px;min-height:32px;height:auto;flex-wrap:wrap}
  #edImgCol .eic{display:flex;gap:6px;align-items:center}
  #edImgCol .ib{width:34px;height:34px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  #edImgCol .ib:hover:not(:disabled){border-color:var(--acc);color:var(--acc)} #edImgCol .ib:disabled{opacity:.4;cursor:default}
  #edImgCol .ib.busy .rf{animation:edspin .8s linear infinite} @keyframes edspin{to{transform:rotate(360deg)}}
  #edImgState{font-size:13px;color:#b91c1c;margin-top:6px;min-height:1px}
  #shotMask{position:fixed;inset:0;z-index:250;background:rgba(15,23,42,.72);display:flex;align-items:center;justify-content:center;cursor:crosshair;user-select:none;touch-action:none}
  #shotMask canvas{max-width:94vw;max-height:90vh;box-shadow:0 8px 40px rgba(0,0,0,.5);background:#fff} #shotMask .tip{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;font-size:13px;padding:6px 14px;border-radius:16px;pointer-events:none}
  
  /* 实时预览长公式内部横向滚动，决不撑宽容器挤压右侧 */
  #edPrev{position:relative;height:300px;overflow-y:auto;overflow-x:auto;min-width:0;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--bg);transition:box-shadow .3s}
  #edPrev.flash{animation:edflash .9s ease}
  @keyframes edflash{0%{box-shadow:0 0 0 3px var(--acc)}50%{box-shadow:0 0 0 3px var(--acc)}100%{box-shadow:none}}
  #edPrev p{margin:4px 0;white-space:pre-wrap}
  #edPrev .katex-display{max-width:100%;overflow-x:auto;overflow-y:hidden;padding:4px 0}
  table.mdt{border-collapse:collapse;margin:8px 0;font-size:14px}
  table.mdt th,table.mdt td{border:1px solid var(--line);padding:4px 12px}
  table.mdt th{background:var(--card)}

  /* 渲染区与实时预览内的 [公式没通过] 可点击胶囊样式 */
  #prev .bad,#edPrev .bad{display:inline-flex;align-items:center;gap:4px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.32);padding:1px 8px;border-radius:6px;transition:all .15s ease;user-select:none}
  #prev .bad:hover,#edPrev .bad:hover,#prev .bad.bad-editing-active,#edPrev .bad.bad-editing-active{background:#ef4444;color:#fff;border-color:#dc2626;transform:translateY(-1px)}
  #prev .bad.bad-editing-active,#edPrev .bad.bad-editing-active{outline:2px solid rgba(239,68,68,.45);outline-offset:2px}

  /* 点击 [公式没通过] 弹出的专属公式编辑区弹窗（固定在右侧编辑区，无全屏遮罩阴影与模糊，不遮挡左侧渲染预览） */
  #fmlModalMask{position:fixed;top:0;right:0;bottom:0;left:50%;z-index:220;background:transparent;backdrop-filter:none;pointer-events:none;display:none;align-items:center;justify-content:center;padding:16px 20px}
  #fmlModalMask.on{display:flex}
  @media (max-width: 1080px){#fmlModalMask{left:0}}
  #fmlModal{pointer-events:auto;width:100%;max-width:740px;max-height:calc(100vh - 32px);overflow-y:auto;background:var(--card,#fff);color:var(--ink,#1d2430);border:2px solid var(--acc,#2f6fed);border-radius:14px;box-shadow:none;padding:16px 18px;display:flex;flex-direction:column;gap:12px;animation:fmlPopIn .16s cubic-bezier(.16,1,.3,1)}
  @keyframes fmlPopIn{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}
  .fml-hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line,#dde1e8)}
  .fml-title-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
  .fml-title{font-size:15px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:7px}
  .fml-title::before{content:'';width:3.5px;height:15px;border-radius:2px;background:var(--acc,#2f6fed);flex:none}
  #fmlModalHead{color:var(--acc,#2f6fed);font-weight:700}
  .fml-step-nav{display:inline-flex;align-items:center;gap:4px;background:var(--bg,#f6f7f9);border:1px solid var(--line,#dde1e8);border-radius:999px;padding:1px 7px;font-size:12px;color:var(--mute)}
  .fml-step-btn{border:none;background:transparent;color:var(--ink);cursor:pointer;padding:0 3px;font-size:11px;line-height:1;border-radius:4px}
  .fml-step-btn:hover:not(:disabled){color:var(--acc);background:rgba(47,111,237,.1)}
  .fml-step-btn:disabled{opacity:.35;cursor:default}
  .fml-tools{display:flex;align-items:center;gap:7px;flex:none}
  .fml-tools .ib{width:34px;height:34px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .15s}
  .fml-tools .ib:hover:not(:disabled){border-color:var(--acc);color:var(--acc);background:rgba(47,111,237,.06);transform:scale(1.05)}
  .fml-tools .ib:disabled{opacity:.4;cursor:default}
  .fml-tools .ib.busy .rf{animation:edspin .8s linear infinite}
  .fml-tools .ib-shot{border-color:rgba(47,111,237,.45);color:var(--acc,#2f6fed);background:rgba(47,111,237,.06);width:auto;border-radius:999px;padding:0 12px;gap:6px;font-size:13px;font-weight:600}
  .fml-tools .ib-shot:hover:not(:disabled){background:var(--acc,#2f6fed);color:#fff;border-color:var(--acc,#2f6fed);box-shadow:0 3px 10px rgba(47,111,237,.28)}
  .fml-err-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:8px;padding:7px 11px;font-size:12.5px;color:var(--bad,#c62828);flex-wrap:wrap}
  .fml-err-bar.ok-bar{background:rgba(26,138,74,.08);border-color:rgba(26,138,74,.25);color:var(--ok,#1a8a4a)}
  .fml-err-msg{flex:1;min-width:0;word-break:break-all;font-family:Consolas,monospace;font-size:12px}
  .fml-macro-btn{font:inherit;font-size:12px;font-weight:600;padding:3px 10px;border-radius:6px;border:1px solid rgba(47,111,237,.35);background:var(--card,#fff);color:var(--acc,#2f6fed);cursor:pointer;white-space:nowrap;transition:all .15s}
  .fml-macro-btn:hover{background:var(--acc,#2f6fed);color:#fff}
  .fml-ctx-bar{font-size:12px;color:var(--mute);background:var(--bg);border-radius:6px;padding:5px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px dashed var(--line)}
  .fml-ctx-bar code{font-family:Consolas,monospace;color:var(--ink)}
  .fml-ctx-tag{display:inline-block;background:#fee2e2;color:#991b1b;font-weight:600;padding:0 5px;border-radius:4px;margin:0 3px;font-size:11.5px}
  .fml-body-grid{display:grid;grid-template-columns:1fr;gap:10px}
  .fml-body-grid.has-shot{grid-template-columns:minmax(0,1fr) 170px}
  #fmlSrc{width:100%;height:105px;min-height:76px;font:13.5px/1.55 Consolas,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 11px;resize:vertical}
  #fmlSrc:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 2px rgba(47,111,237,.15)}
  #fmlShotBox{display:none;position:relative;height:105px;border:1px dashed var(--line);border-radius:8px;background:var(--bg);overflow:hidden;align-items:center;justify-content:center}
  .fml-body-grid.has-shot #fmlShotBox{display:flex}
  #fmlShotImg{max-width:100%;max-height:100%;object-fit:contain;background:#fff}
  .fml-prev-hdr{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--mute)}
  #fmlPrevBox{min-height:74px;max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:16px}
  #fmlPrevBox .katex-display{margin:4px 0;max-width:100%;overflow-x:auto}
  .fml-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:8px;border-top:1px solid var(--line);flex-wrap:wrap}
  .fml-auto-lbl{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute);cursor:pointer;user-select:none}
  .fml-foot-btns{display:flex;align-items:center;gap:8px;margin-left:auto}

  /* 渲染预览区卡片右上角快捷删除按钮（悬停浮现，前置多余行直接醒目可见） */
  #prev .q{position:relative}
  #prev .q .q-del-btn{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;border:1px solid #fecaca;background:#fff;color:#ef4444;font-size:14px;line-height:1;display:none;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.08);padding:0}
  #prev .q:hover .q-del-btn{display:inline-flex}
  #prev .q.head-block .q-del-btn{display:inline-flex;border-color:#fca5a5}
  #prev .q .q-del-btn:hover{background:#ef4444;color:#fff;border-color:#ef4444;transform:scale(1.12);box-shadow:0 3px 8px rgba(239,68,68,.3)}
</style>
<script>
  (function() {
    try {
      var m = localStorage.getItem('md_layout_mode') || 'layout-dashboard';
      document.documentElement.className = (document.documentElement.className + ' ' + m).trim();
    } catch (_) {}
  })();
</script>
</head>
<body>
<main>
  <div class="app-hdr">
    <div class="app-title-group">
      <h1>Markdown 公式清洗</h1>
    </div>
    <div class="layout-switcher" id="layoutSwitcher" title="切换工作台布局模式">
      <button type="button" class="layout-btn" data-mode="layout-dashboard" title="各模块两两对半：首排左统计、右文件等高平齐；二排渲染与编辑等高平齐；三排MD区全宽">⊞ 模块对半仪表盘 (推荐)</button>
      <button type="button" class="layout-btn" data-mode="layout-workstation" title="严格 50%:50% 左右对半分：左侧文件区与修复统计，右侧编辑区田字格；下方MD区与渲染区各占50%">⊞ 左右对半工作台</button>
    </div>
  </div>

  <div id="zoneContainer">
  <div class="card" id="sec-file">
    <div id="drop">把 .md 文件拖到这里，或点击选择文件<br><span class="hint">也可以直接把文本粘贴到下面左边的框里</span></div>
    <input id="file" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
    <div class="opts">
      <label><input type="checkbox" id="oReorder" checked> 重排颠倒的小问 (a)(b)(c)</label>
      <label><input type="checkbox" id="oNoise" checked> 删除模型草稿 (Note: / Let's… / 占位图)</label>
      <label title="解决 Pandoc 等工具报 Duplicate identifier 'section'；其它预览器可能把 {#q1-1} 原样显示出来"><input type="checkbox" id="oIds"> 题号标题加唯一 ID <code>{#q1-1}</code></label>
      <label><input type="checkbox" id="oTag" checked> \tag 改写成 \qquad\text{()}</label>
    </div>
    <div class="bar">
      <button class="primary" id="run">清洗</button>
      <button id="save" disabled title="只有用“点击选择文件”或直接拖入的文件才能写回；需要 Chrome / Edge">保存到源文件</button>
      <label class="hint"><input type="checkbox" id="oBak" checked> 覆盖前先下载一份原文件备份</label>
      <button id="dl" disabled>下载清洗结果</button>
      <button id="copy" disabled>复制结果</button>
      <span id="fname" class="hint"></span>
    </div>
  </div>

  <div class="card" id="editor">
    <div class="grid">
      <div id="edSrcCol">
        <div class="eh"><span class="hint">源码编辑区 <span id="edTitle"></span></span></div>
        <textarea id="edSrc" spellcheck="false" style="height:300px" placeholder="还没有选题"></textarea>
      </div>
      <div id="edImgCol">
        <div class="eh"><span class="hint">截图 / 图片识别区</span>
          <span class="eic">
            <button class="ib" id="edImgShot" title="截图：选一个窗口或屏幕，再框选要识别的区域"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg></button>
            <button class="ib" id="edImgGo" title="重新识别" disabled><svg class="rf" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
            <button class="ib" id="edImgClear" title="清除图片" disabled><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
          </span></div>
        <div id="edImg" tabindex="0" title="拖入图片、Ctrl+V 粘贴截图，或点击选择图片">
          <div id="edImgHint">把原书截图<b>拖到这里</b><br>或 <b>Ctrl+V</b> 粘贴<br>或 <b>点击</b>选择图片</div>
          <img id="edImgPrev" alt="" style="display:none">
        </div>
        <input type="file" id="edImgFile" accept="image/*" hidden>
        <div id="edImgState"></div>
      </div>
      <div id="edPrevCol">
        <div class="eh"><span class="hint">实时预览</span><span class="hint" id="edPrevNo"></span></div>
        <div id="edPrev"></div>
      </div>
      <div id="edCheck">
        <div class="eh">
          <span class="hint">核对</span>
          <span class="hdrr">
            <span class="hint" id="ordMsg"></span>
            <div class="chk-search" id="chkSearch" title="输入题号快速调出任意题目（如 1.1）进行修改，自动保存">
              <span class="chk-search-ic" id="chkSearchIc" title="点击调出该题 (Enter)">🔍</span>
              <input class="chk-search-in" id="chkSearchIn" type="text" placeholder="调出题号 (如 1.1)" autocomplete="off" spellcheck="false" />
              <button class="chk-search-clear" id="chkSearchClear" title="清空" type="button">×</button>
              <button class="chk-search-go" id="chkSearchGo" title="调出并编辑这道题 (Enter)" type="button">↵</button>
              <div class="chk-search-drop" id="chkSearchDrop"></div>
            </div>
            <span class="cnt" id="chkBadge"></span>
            <button id="ordAll" title="一键修复顺序：把列表里所有小问顺序乱的题，都按 a→b→c 排一遍" aria-label="一键修复顺序"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg></button>
          </span>
        </div>
        <div id="todo" class="hint">尚未运行</div>
      </div>
    </div>
    <div id="edStatus" style="margin-top:8px"></div>
  </div>

  <div class="grid" id="sec-md">
    <div class="card">
      <h2 style="display:flex;align-items:center;justify-content:space-between">
        <span>原文</span>
        <span style="display:inline-flex;align-items:center;gap:6px">
          <button id="qPrev" class="ib" style="width:24px;height:24px;padding:0;font-size:11px;border-radius:5px;cursor:pointer" title="跳转到上一题（两边第一排同行对齐）">▲</button>
          <button id="qNext" class="ib" style="width:24px;height:24px;padding:0;font-size:11px;border-radius:5px;cursor:pointer" title="跳转到下一题（两边第一排同行对齐）">▼</button>
          <label class="hint" style="font-size:12.5px;font-weight:400;cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:4px" title="滚动任意一边时，题号（如 5.5、5.6）在两侧第一排精准同行对齐">
            <input type="checkbox" id="syncScroll" checked> 🔗 题号同行对比
          </label>
        </span>
      </h2>
      <textarea id="src" spellcheck="false" placeholder="在这里粘贴 Markdown，或拖入文件"></textarea>
    </div>
    <div class="card"><h2>清洗后</h2><textarea id="dst" spellcheck="false"></textarea></div>
  </div>

  <div class="card" id="sec-render">
    <h2>渲染预览 <span id="pstatus" class="hint"></span></h2>
    <div id="prev" class="hint">尚未运行</div>
  </div>

  <div class="grid" id="sec-fix">
    <div class="card">
      <div class="eh"><span class="hint">修复统计</span></div>
      <div id="stats" class="hint">尚未运行</div>
    </div>
    <div class="card">
      <div class="eh"><span class="hint">已删除的模型草稿</span><span class="cnt" id="removedBadge"></span></div>
      <div id="removedDrafts" class="hint">尚未运行</div>
    </div>
  </div>
  </div> <!-- /#zoneContainer -->
</main>

<!-- 点击 [公式没通过] 弹出的专属公式编辑区弹窗 -->
<div id="fmlModalMask" role="dialog" aria-modal="true" aria-labelledby="fmlModalTitle">
  <div id="fmlModal">
    <div class="fml-hdr">
      <div class="fml-title-wrap">
        <span class="fml-title" id="fmlModalTitle">公式编辑区</span>
        <span id="fmlModalHead"></span>
        <span class="fml-step-nav" id="fmlStepNav">
          <button type="button" class="fml-step-btn" id="fmlPrevBad" title="切换到本题上一处未通过公式">◀</button>
          <span id="fmlStepTxt">第 1/1 处</span>
          <button type="button" class="fml-step-btn" id="fmlNextBad" title="切换到本题下一处未通过公式">▶</button>
        </span>
      </div>
      <div class="fml-tools">
        <button type="button" class="ib ib-shot" id="fmlShotBtn" title="同款桌面截图：框选原书对应公式，识别通过后直接自动插入替换对应部分">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>
          <span>桌面截图</span>
        </button>
        <button type="button" class="ib" id="fmlRetryBtn" title="重新识别刚才的截图" disabled>
          <svg class="rf" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
        <button type="button" class="ib" id="fmlUploadBtn" title="选择本地截图图片（也支持直接 Ctrl+V 粘贴或拖入图片）">

const $ = id => document.getElementById(id);

// curHandle: 通过“选择器 / 拖入”拿到的文件句柄 (Chrome/Edge)，有它才能写回原位置

$('file').onchange = e => e.target.files[0] && loadFile(e.target.files[0], null);
['dragover','dragenter'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));

async function onDrop(e){
  e.preventDefault(); e.stopPropagation();
  const it = e.dataTransfer.items && e.dataTransfer.items[0];
  const hp = it && it.getAsFileSystemHandle ? it.getAsFileSystemHandle() : null;   // 必须在 await 之前同步取
  const f0 = e.dataTransfer.files[0]; if (!f0) return;

}
drop.addEventListener('drop', onDrop);
document.addEventListener('dragover', e => e.preventDefault());

function run(){
  let text = $('src').value;

  show(result, report);

}
const cleanOpts = () => ({ reorder: $('oReorder').checked, noise: $('oNoise').checked, tag: $('oTag').checked, ids: $('oIds').checked });

let lastReport = null;
function show(result, report){
  const k = typeof katex !== 'undefined' ? katex : null;

  last = result; $('dst').value = result; $('dl').disabled = $('copy').disabled = $('save').disabled = false;
  if (window.markSyncDirty) window.markSyncDirty();

  const fx = Object.entries(report.fixed);
  $('stats').innerHTML = fx.length ? fx.map(([a,b]) => `<div class="stat"><span>${esc(a)}</span><b>${b}</b></div>`).join('') : '<span class="ok">没有需要修复的地方 ✓</span>';

  const rem = report.removed || [];
  if ($('removedBadge')) {
    $('removedBadge').textContent = rem.length ? `${rem.length} 处` : '0 处';
    $('removedBadge').className = 'cnt' + (rem.length ? '' : ' ok');
  }
  if ($('removedDrafts')) {
    if (!rem.length) {
      $('removedDrafts').innerHTML = '<span class="ok">未检测到模型草稿 ✓</span>';
    } else {
      const itemsHtml = rem.map(x => {
        const m = /^###\s*(\S+)([\s\S]*)$/.exec(x);
        if (m) {
          const head = m[1], rest = m[2];
          return `<li><span class="rem-h" data-h="${esc(head)}" title="点击在编辑器中查看此题">### ${esc(head)}</span>${esc(rest)}</li>`;
        }
        return `<li>${esc(x)}</li>`;
      }).join('');
      $('removedDrafts').innerHTML = `<ul class="removed-list">${itemsHtml}</ul>`;
    }
  }

  let h = '';
  const sec = (cls, title, arr) => {
    if (!arr.length) return;
    const t = normText();
    const items = arr.slice(0, 40).map(x => {
      const m = x.match(/第(\d+)章题号不连续:\s*(\d+)\s*→\s*(\d+)/);
      if (m) {

        const hasFilled = !!(rng && t.slice(rng[0], rng[1]).replace(/^###[^\n]*\n*/, '').trim());
        const isDone = fixedSet.has(qHead) || fixedSet.has(x) || hasFilled;

      }
      const isDone = fixedSet.has(x);
      return `<div class="item warn-item${isDone ? ' done' : ''}" data-h="${esc(x)}" data-note="${esc(x)}"><label><input type="checkbox" class="ck" ${isDone ? 'checked' : ''}></label> <b class="warn-txt">${esc(x)}</b></div>`;

  sec('warn', '其它提示', report.notes.filter(n => !/^### /.test(n)));

// ---------------- “需要你看一眼”：按题号汇总 + 题目编辑器 ----------------
let fixedSet = new Set(), issueHeads = [];
function issueRows(report){
  const map = new Map(), other = [];
  const add = (h, why) => { if (!map.has(h)) map.set(h, []); if (!map.get(h).includes(why)) map.get(h).push(why); };
  const parse = (s, re) => { const m = re.exec(s); return m ? [m[1], m[2]] : null; };
  report.unbalanced.forEach(s => { const p = parse(s, /^### (\S+)\s+([\s\S]*)$/); p ? add(p[0], '$ 不配对：' + p[1]) : other.push(s); });
  report.remaining.forEach(s => {
    const p = parse(s, /^### (\S+?):\s*([\s\S]*)$/);
    if (!p) { other.push(s); return; }
    if (/^KaTeX 警告/.test(p[1])) return;
    add(p[0], /乱码/.test(p[1]) ? '有乱码' : /裸露/.test(p[1]) ? p[1] : '公式没通过');
  });
  report.notes.forEach(s => { const p = parse(s, /^### (\S+)\s+([\s\S]*)$/); if (p) add(p[0], p[1]); });
  (report.suspect || []).forEach(x => add(x, '转写残缺（已标“待核对”）'));
  issueHeads = [...map.keys()]; window.issueMap = map;
  let out = '';
  if (map.size) {
    out += '<div id="issues">';
    map.forEach((why, h) => {
      out += `<div class="item${fixedSet.has(h) ? ' done' : ''}" data-h="${esc(h)}"><label><input type="checkbox" class="ck" ${fixedSet.has(h) ? 'checked' : ''}></label> <b>${esc(h)}</b> <button class="up" title="上传这道题的原书截图，传完直接重新识别并把这道题换成识别结果">📎 上传截图</button><button class="snap" data-h="${esc(h)}" title="截图：选一个窗口或屏幕，框选后直接识别并替换这道题"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg></button><div class="why">${esc(why.slice(0, 3).join('；'))}</div></div>`;
    });
    out += '</div>';
  }
  if (other.length) out += `<div class="bad"><b>其它问题（${other.length}）</b><ul>${other.slice(0, 20).map(x => '<li>' + esc(x) + '</li>').join('')}</ul></div>`;
  return out;
}
function updateProgress(){
  const b = $('chkBadge'); if (!b) return;
  const total = issueHeads.length, n = issueHeads.filter(h => fixedSet.has(h)).length, left = total - n;
  b.textContent = total ? (left ? `待核对 ${left} 题` : '已全部核对 ✓') : (lastReport ? '无待核对' : '');
  b.className = 'cnt' + (left ? '' : ' ok');
  if (window._previewCtx && typeof window._previewCtx.updateStatus === 'function') {
    window._previewCtx.updateStatus();
  }
  if (typeof window.refreshZoneBadges === 'function') {
    window.refreshZoneBadges();
  }
}
function setFixed(h, v){
  v ? fixedSet.add(h) : fixedSet.delete(h);
  document.querySelectorAll('#todo .item').forEach(el => {
    if (el.dataset.h === h) {

}
$('todo').addEventListener('click', e => {
  const nb = e.target.closest && e.target.closest('.btn-quick-new');

  }
  const item = e.target.closest && e.target.closest('.item'); if (!item) return;

  if (!h) return;
  if (item.classList.contains('warn-item') && !blockRange(normText(), h)) {

  }

});

// ---- 手动排顺序 ----
function setDst(text, crlf) {

      if (!f) return;                                                              // 取消了

// ---------------- 全局操作撤销栈（上一次操作恢复） ----------------
const _undoStack = [];
const _MAX_UNDO = 40;
let _undoBase = null;
let _edTypingActive = false;
let _edTypingTimer = null;
let _dstTypingActive = false;
let _dstTypingTimer = null;

function _captureSnap(label) {
  return {
    dst: $('dst') ? $('dst').value : '',
    fixed: [...fixedSet],
    edHead: edHead || null,
    edSrc: $('edSrc') ? $('edSrc').value : '',
    reportFixed: (lastReport && lastReport.fixed) ? Object.assign({}, lastReport.fixed) : {},
    reportRemoved: (lastReport && lastReport.removed) ? [...lastReport.removed] : [],
    label: label || '上一次操作'
  };
}

window.refreshUndoBtnUI = function() {
  const btn = document.getElementById('edUndoBtn');
  if (!btn) return;
  if (_undoStack.length > 0) {
    const top = _undoStack[_undoStack.length - 1];
    btn.disabled = false;
    btn.title = `撤销上一次操作：${top.label}（可连退 ${_undoStack.length} 步）`;
  } else {
    btn.disabled = true;
    btn.title = '暂无可撤销的操作';
  }
};

window.syncUndoBase = function() {
  _edTypingActive = false;
  _dstTypingActive = false;
  clearTimeout(_edTypingTimer);
  clearTimeout(_dstTypingTimer);
  _undoBase = _captureSnap('');
  window.refreshUndoBtnUI();
};

window.resetUndoHistory = function() {
  _undoStack.length = 0;
  window.syncUndoBase();
};

window.recordUndo = function(label) {
  if (_edTypingActive) {
    _edTypingActive = false;
    clearTimeout(_edTypingTimer);
    _undoBase = _captureSnap('');
  }
  if (_dstTypingActive) {
    _dstTypingActive = false;
    clearTimeout(_dstTypingTimer);
    _undoBase = _captureSnap('');
  }
  const snap = _undoBase ? Object.assign({}, _undoBase, { label: label || '上一次操作' }) : _captureSnap(label);
  if (_undoStack.length > 0) {
    const prev = _undoStack[_undoStack.length - 1];
    if (prev.dst === snap.dst && prev.edSrc === snap.edSrc && prev.edHead === snap.edHead && prev.fixed.join(',') === snap.fixed.join(',')) {
      prev.label = snap.label;
      window.refreshUndoBtnUI();
      return;
    }
  }
  _undoStack.push(snap);
  if (_undoStack.length > _MAX_UNDO) _undoStack.shift();
  window.refreshUndoBtnUI();
};

window.undoLastOperation = function() {
  if (!_undoStack.length) return;
  clearTimeout(edTimer); edTimer = null;
  clearTimeout(editTimer); editTimer = null;
  clearTimeout(_edTypingTimer); _edTypingActive = false;
  clearTimeout(_dstTypingTimer); _dstTypingActive = false;

  const snap = _undoStack.pop();
  const k = typeof katex !== 'undefined' ? katex : null;

  fixedSet.clear();
  (snap.fixed || []).forEach(h => fixedSet.add(h));

  $('dst').value = snap.dst || '';
  last = $('dst').value;
  $('dl').disabled = $('copy').disabled = $('save').disabled = !last.trim();

  const r = MdCleaner.clean(last.replace(/\r\n/g, '\n'), Object.assign({}, cleanOpts(), { reorder: false, noise: false }), k);
  if (snap.reportFixed && Object.keys(snap.reportFixed).length) {
    r.report.fixed = Object.assign({}, snap.reportFixed);
  }
  if (snap.reportRemoved && snap.reportRemoved.length) {
    r.report.removed = [...snap.reportRemoved];
  }
  show(last, r.report);

  if (snap.edHead && blockRange(normText(), snap.edHead)) {
    edHead = snap.edHead;
    _lastErrNavHead = edHead;
    const rng = blockRange(normText(), edHead);
    $('edSrc').value = (snap.edSrc !== undefined && snap.edSrc !== '') ? snap.edSrc : normText().slice(rng[0], rng[1]).replace(/\n+$/, '');
    $('edTitle').textContent = '· ' + edHead;
    $('edPrevNo').textContent = '题号 ' + edHead;
    edRender();
    edCheck(false);
    const todoBox = $('todo');
    if (todoBox) {
      todoBox.querySelectorAll('.item.editing-cur').forEach(el => el.classList.remove('editing-cur'));
      const curItem = Array.from(todoBox.querySelectorAll('.item')).find(el => el.dataset.h === edHead);
      if (curItem) curItem.classList.add('editing-cur');
    }
  } else {
    resetEditor();
  }

  _undoBase = _captureSnap('');
  window.refreshUndoBtnUI();

// 题号所在题目块的起止位置提取：支持首行无换行、行尾空白与 Pandoc 属性、以及纯题号容错匹配
function blockRange(s, h) {
  if (!s || !h) return null;
  const escH = h.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const reExact = new RegExp('(?:^|\\n)(###\\s+' + escH + '(?:[ \\t]*|[ \\t]+[^\\n]*))(?:\\n|$)', 'm');
  let m = reExact.exec(s);
  if (!m) {
    const numMatch = h.match(/^(\d+(?:\.\d+)?|\d+)/);
    if (numMatch) {
      const reNum = new RegExp('(?:^|\\n)(###\\s+' + numMatch[1].replace('.', '\\.') + '(?:[ \\t]*|[ \\t]+[^\\n]*))(?:\\n|$)', 'm');
      m = reNum.exec(s);
    }
  }
  if (!m) return null;

  const start = s.charAt(m.index) === '\n' ? m.index + 1 : m.index;
  const nextRe = /\n(?=###\s+)/g;
  nextRe.lastIndex = start + 3;
  const nextMatch = nextRe.exec(s);
  const end = nextMatch ? nextMatch.index + 1 : s.length;
  return [start, end];
}

// 智能寻找新题号在全文中的有序插入位置（保证题号不颠倒、章节不乱）
function findInsertPosition(text, h) {
  const m = h.match(/(?:^|\s|第|习题)?\s*(\d+)(?:\.(\d+))?/);
  if (!m) return text.length;
  const targetChap = m[2] !== undefined ? parseInt(m[1], 10) : null;
  const targetNum = m[2] !== undefined ? parseFloat(m[2]) : parseFloat(m[1]);

  const blocks = [];
  const re = /(?:^|\n)(###\s+([^\n]+))/g;
  let match;
  while ((match = re.exec(text)) !== null) {
    const rawHead = match[2].trim();
    const start = match.index === 0 && text.startsWith('###') ? 0 : match.index + 1;
    const bm = rawHead.match(/(?:^|\s|第|习题)?\s*(\d+)(?:\.(\d+))?/);
    let chap = null, num = null;
    if (bm) {
      chap = bm[2] !== undefined ? parseInt(bm[1], 10) : null;
      num = bm[2] !== undefined ? parseFloat(bm[2]) : parseFloat(bm[1]);
    }
    blocks.push({ head: rawHead, start, chap, num });
  }

  if (!blocks.length) return text.length;

  if (targetChap !== null) {
    const sameChap = blocks.filter(b => b.chap === targetChap && b.num !== null);
    if (sameChap.length) {
      const prevs = sameChap.filter(b => b.num < targetNum);
      if (prevs.length) {
        const lastPrev = prevs[prevs.length - 1];
        const nextIdx = blocks.findIndex(b => b.start === lastPrev.start) + 1;
        if (nextIdx < blocks.length) return blocks[nextIdx].start;
        return text.length;
      } else {
        return sameChap[0].start;
      }
    } else {
      const nextChaps = blocks.filter(b => b.chap !== null && b.chap > targetChap);
      if (nextChaps.length) return nextChaps[0].start;
      const prevChaps = blocks.filter(b => b.chap !== null && b.chap < targetChap);
      if (prevChaps.length) {
        const lastOfPrev = prevChaps[prevChaps.length - 1];
        const nextIdx = blocks.findIndex(b => b.start === lastOfPrev.start) + 1;
        if (nextIdx < blocks.length) return blocks[nextIdx].start;
        return text.length;
      }
    }
  } else {
    const numBlocks = blocks.filter(b => b.num !== null);
    const prevs = numBlocks.filter(b => b.num < targetNum);
    if (prevs.length) {
      const lastPrev = prevs[prevs.length - 1];
      const nextIdx = blocks.findIndex(b => b.start === lastPrev.start) + 1;
      if (nextIdx < blocks.length) return blocks[nextIdx].start;
      return text.length;
    } else if (numBlocks.length) {
      return numBlocks[0].start;
    }
  }
  return text.length;
}

// 全文题目块解析提取器（支持识别前置内容、普通题目、重复题目行）
function getAllQuestionBlocks(text) {
  text = text !== undefined ? text : normText();
  if (!text) return [];
  const blocks = [];

  // 1. 检查是否存在前置 headText（在第一个 ### 之前的文本）
  const firstHashMatch = text.match(/(?:^|\n)###\s+/);
  const firstHashPos = firstHashMatch ? (firstHashMatch.index === 0 && text.startsWith('###') ? 0 : firstHashMatch.index + 1) : -1;

  if (firstHashPos > 0) {
    const headText = text.slice(0, firstHashPos).trim();
    if (headText) {
      let qNo = '';
      const numM = headText.match(/^(\d+(?:\.\d+)?|\d+)/) || headText.match(/习题\s*(\d+(?:\.\d+)?|\d+)/i);
      if (numM) qNo = numM[1];
      const firstLine = headText.split('\n')[0].trim();
      blocks.push({
        rawHead: firstLine,
        head: '【开头前置行】' + firstLine.slice(0, 24),
        displayHead: '【开头前置行】' + firstLine.slice(0, 24),
        qNo,
        start: 0,
        end: firstHashPos,
        text: headText,
        isHeadBlock: true
      });
    }
  }

  // 2. 匹配所有 ### 题目标题块
  const re = /(?:^|\n)(###\s+([^\n]+))/g;
  let match;
  while ((match = re.exec(text)) !== null) {
    const rawHead = match[2].trim();
    const cleanHead = rawHead.replace(/\s*\{#[^}]+\}\s*$/, '').trim();
    const start = (match.index === 0 && text.startsWith('###')) ? 0 : match.index + 1;
    let qNo = '';
    const numM = cleanHead.match(/^(\d+(?:\.\d+)?|\d+)/) || cleanHead.match(/习题\s*(\d+(?:\.\d+)?|\d+)/i);
    if (numM) qNo = numM[1];
    blocks.push({
      rawHead,
      head: cleanHead,
      displayHead: cleanHead,
      qNo,
      start,
      matchIndex: match.index,
      isHeadBlock: false
    });
  }

  // 计算每个标准 block 的结束位置
  for (let i = 0; i < blocks.length; i++) {
    if (blocks[i].end === undefined) {
      const nextStart = (i + 1 < blocks.length) ? blocks[i + 1].start : text.length;
      blocks[i].end = nextStart;
      blocks[i].text = text.slice(blocks[i].start, blocks[i].end);
    }
  }

  const counts = new Map();
  blocks.forEach(b => {
    const key = b.qNo || b.head;
    counts.set(key, (counts.get(key) || 0) + 1);
  });
  blocks.forEach(b => {
    const key = b.qNo || b.head;
    b.isDup = (counts.get(key) || 0) > 1;
  });

  return blocks;
}
window.getAllQuestionBlocks = getAllQuestionBlocks;

// 检查全文是否存在重复题目行（如重复出现两个 1.1）
function checkDuplicateQuestions(text) {
  const blocks = getAllQuestionBlocks(text);
  const map = new Map();
  blocks.forEach(b => {
    const key = b.qNo || b.head;
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(b);
  });
  const dups = [];
  map.forEach((list, key) => {
    if (list.length > 1) {
      dups.push({ key, count: list.length, blocks: list });
    }
  });
  return dups;
}

// 删除指定题目块：支持按题号或标题删除，支持只清理重复项
function deleteQuestionBlock(head, opts = {}) {
  flushEdEdit();
  const t = normText();
  const blocks = getAllQuestionBlocks(t);
  if (!blocks.length) return { ok: false, msg: '文档为空或未找到题目' };

  const normStr = s => s.replace(/[\s\-_()（）[\]【】]/g, '').toLowerCase();
  const targetNorm = normStr(head.replace(/^#{1,6}\s*/, '').trim());
  const numM = head.match(/^(\d+(?:\.\d+)?|\d+)/);
  const targetNum = numM ? numM[1] : null;

  const matched = blocks.filter(b => {
    if (b.head === head || normStr(b.head) === targetNorm) return true;
    if (targetNum && b.qNo && b.qNo === targetNum) return true;
    return false;
  });

  if (!matched.length) {
    return { ok: false, msg: `未找到题号为 “${head}” 的题目` };
  }

  let toRemove = [];
  if (opts.occurrence === 'duplicate_only') {
    toRemove = matched.slice(1);
    if (!toRemove.length) return { ok: false, msg: `题目 “${head}” 仅有一处，无多余重复项` };
  } else if (opts.occurrence === 'last') {
    toRemove = [matched[matched.length - 1]];
  } else if (typeof opts.occurrence === 'number') {
    toRemove = matched[opts.occurrence] ? [matched[opts.occurrence]] : [];
  } else {
    toRemove = matched;
  }

  if (!toRemove.length) return { ok: false, msg: '没有找到要删除的题目块' };

  if (!opts._skipUndo) {
    window.recordUndo('删除题目 ' + head);
  }

  toRemove.sort((a, b) => b.start - a.start);
  let newText = t;
  toRemove.forEach(b => {
    const before = newText.slice(0, b.start).replace(/\n*$/, '');
    const after = newText.slice(b.end).replace(/^\n*/, '');
    newText = (before && after) ? (before + '\n\n' + after) : (before || after);
  });

  newText = newText.replace(/\n{3,}/g, '\n\n');
  const crlf = /\r\n/.test($('dst').value);
  $('dst').value = crlf ? newText.replace(/\n/g, '\r\n') : newText;
  last = $('dst').value;
  $('dl').disabled = $('copy').disabled = $('save').disabled = false;

  previewNodes.delete(head);
  toRemove.forEach(b => previewNodes.delete(b.head));

  if (edHead && (edHead === head || toRemove.some(b => b.head === edHead))) {
    resetEditor();
  }

  if (!opts._skipUndo) {
    window.syncUndoBase();
  }

  if (typeof window.triggerProjectAutoSave === 'function') {
    window.triggerProjectAutoSave();
  }

  clearTimeout(editTimer);
  editTimer = setTimeout(() => preview(last, typeof katex !== 'undefined' ? katex : null), 200);

  return { ok: true, removedCount: toRemove.length, head };
}

  let nt = t.slice(0, a[0]) + $('edSrc').value.replace(/\n+$/, '') + '\n\n' + t.slice(a[1]);
  nt = nt.replace(/\n{3,}/g, '\n\n');
  $('dst').value = crlf ? nt.replace(/\n/g, '\r\n') : nt; last = $('dst').value;
  $('dl').disabled = $('copy').disabled = $('save').disabled = false;
  window.syncUndoBase();
  if (typeof window.triggerProjectAutoSave === 'function') window.triggerProjectAutoSave();
}

// 扫描题目源码中未闭合或 KaTeX 渲染不通过的公式起止位置
function findBadFormulaRanges(src) {
  const k = typeof katex !== 'undefined' ? katex : null;
  const ranges = [];
  let i = 0, n = src.length;
  while (i < n) {
    const c = src[i];
    if (c === '\\' && src[i + 1] === '$') { i += 2; continue; }
    if (c === '$') {
      if (src[i + 1] === '$') {
        const j = src.indexOf('$$', i + 2);
        if (j < 0) {
          const endPos = Math.min(n, i + 40);
          ranges.push({ start: i, end: endPos, raw: src.slice(i, endPos), body: src.slice(i + 2, endPos), displayMode: true, unclosed: true, errMsg: '$$ 块级公式未闭合' });
          break;
        }
        const body = src.slice(i + 2, j);
        if (k) {
          try { k.renderToString(body, { displayMode: true, throwOnError: true, strict: 'ignore' }); }
          catch (err) {
            const msg = (err && err.message) ? String(err.message).split('\n')[0] : 'KaTeX 语法错误';
            ranges.push({ start: i, end: j + 2, raw: src.slice(i, j + 2), body, displayMode: true, unclosed: false, errMsg: msg });
          }
        }
        i = j + 2;
        continue;
      }
      let j = i + 1, found = -1;
      while (j < n) {
        if (src[j] === '\\') { j += 2; continue; }
        if (src[j] === '\n' && src[j + 1] === '\n') break;
        if (src[j] === '$') { found = j; break; }
        j++;
      }
      if (found < 0) {
        const lineEnd = src.indexOf('\n', i);
        const endPos = lineEnd > i ? lineEnd : Math.min(n, i + 40);
        ranges.push({ start: i, end: endPos, raw: src.slice(i, endPos), body: src.slice(i + 1, endPos), displayMode: false, unclosed: true, errMsg: '$ 行内公式未闭合' });
        i++;
        continue;
      }
      const body = src.slice(i + 1, found);
      if (k) {
        try { k.renderToString(body, { displayMode: false, throwOnError: true, strict: 'ignore' }); }
        catch (err) {
          const msg = (err && err.message) ? String(err.message).split('\n')[0] : 'KaTeX 语法错误';
          ranges.push({ start: i, end: found + 1, raw: src.slice(i, found + 1), body, displayMode: false, unclosed: false, errMsg: msg });
        }
      }
      i = found + 1;
      continue;
    }
    i++;
  }
  return ranges;
}

// 在源码编辑框 (#edSrc) 中自动滚动并选中第 idx 处未通过的公式
function focusBadFormulaInEdSrc(idx = 0, skipFocus = false) {
  const ta = $('edSrc');
  if (!ta) return false;
  const ranges = findBadFormulaRanges(ta.value);
  if (!ranges.length) return false;
  const r = ranges[Math.min(idx, ranges.length - 1)];
  const linesBefore = ta.value.slice(0, r.start).split('\n').length;
  const totalLines = Math.max(1, ta.value.split('\n').length);
  const modalOpen = $('fmlModalMask') && $('fmlModalMask').classList.contains('on');
  if (!skipFocus && !modalOpen) {
    ta.focus({ preventScroll: true });
  }
  try { ta.setSelectionRange(r.start, r.end); } catch (_) {}
  const approxLineH = ta.scrollHeight / totalLines;
  const targetY = Math.max(0, (linesBefore - 1) * approxLineH - ta.clientHeight * 0.35);
  ta.scrollTo({ top: targetY, behavior: 'smooth' });
  return true;
}

// ---------------- 专属公式编辑区弹窗（点击 [公式没通过] 弹出 · 右上角同款桌面截图 · 自动插入对应部分） ----------------
let _fmlState = null;

// 清理 MinerU / MathML 转换常见的底层 TeX 原语噪音（如 \mathopen{}\mathclose\bgroup ... \aftergroup\egroup）
function cleanTeXMacroNoise(tex) {
  if (!tex || typeof tex !== 'string') return tex;
  return tex
    .replace(/\\mathopen\s*\{\s*\}\s*\\mathclose\s*\\bgroup\b\s*/g, '')
    .replace(/\\aftergroup\s*\\egroup\b\s*/g, '')
    .replace(/\\(?:bgroup|egroup|aftergroup)\b\s*/g, '')
    .replace(/\\mathopen\s*\{\s*\}\s*/g, '')
    .replace(/\\mathclose\s*\{\s*\}\s*/g, '')
    .replace(/[ \t]{2,}/g, ' ');
}

function hasTeXMacroNoise(tex) {
  if (!tex) return false;
  return cleanTeXMacroNoise(tex) !== tex;
}

// 校验并渲染弹窗中的公式源码片段
function validateAndRenderFormulaSnippet(rawText, defaultDisp = false) {
  const k = typeof katex !== 'undefined' ? katex : null;
  let text = (rawText || '').trim();
  if (!text) return { ok: false, errMsg: '公式内容为空', html: '<span class="hint">请输入公式或点击右上角「桌面截图」识别…</span>', normalized: '' };
  if (!k) return { ok: true, errMsg: '', html: esc(text), normalized: text };

  // 若用户输入的是未加 $ 包裹的纯公式，自动按原公式类型补上 $ 或 $$
  let normalized = text;
  if (!normalized.includes('$')) {
    normalized = defaultDisp ? ('$$\n' + normalized + '\n$$') : ('$' + normalized + '$');
  }

  const { segs, problems } = MdCleaner.tokenize(normalized);
  if (problems.length) {
    return {
      ok: false,
      errMsg: problems.join('；'),
      html: `<span class="bad" style="cursor:default">${esc(problems.join('；'))}</span>`,
      normalized
    };
  }

  const mathSegs = segs.filter(s => s.t !== 'text');
  if (!mathSegs.length) {
    try {
      const h = k.renderToString(text, { displayMode: defaultDisp, throwOnError: true, strict: 'ignore' });
      return { ok: true, errMsg: '', html: h, normalized: defaultDisp ? ('$$\n' + text + '\n$$') : ('$' + text + '$') };
    } catch (e) {
      const msg = (e && e.message) ? String(e.message).split('\n')[0] : 'KaTeX 语法错误';
      const fallbackHtml = k.renderToString(text, { displayMode: defaultDisp, throwOnError: false, strict: 'ignore' });
      return { ok: false, errMsg: msg, html: fallbackHtml, normalized };
    }
  }

  let firstErr = '';
  let html = '';
  for (const s of segs) {
    if (s.t === 'text') {
      html += esc(s.s).replace(/&amp;emsp;/g, '　　').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
    } else {
      const isDisp = s.t === 'disp';
      try {
        const rendered = k.renderToString(s.s, { displayMode: isDisp, throwOnError: true, strict: 'ignore' });
        html += isDisp ? `<div style="text-align:center;margin:4px 0">${rendered}</div>` : rendered;
      } catch (e) {
        if (!firstErr) firstErr = (e && e.message) ? String(e.message).split('\n')[0] : 'KaTeX 语法错误';
        // 使用 throwOnError: false 渲染出带红字定位的公式预览，直观看出具体哪个符号报错
        const errRendered = k.renderToString(s.s, { displayMode: isDisp, throwOnError: false, strict: 'ignore' });
        html += isDisp ? `<div style="text-align:center;margin:4px 0">${errRendered}</div>` : errRendered;
      }
    }
  }

  return { ok: !firstErr, errMsg: firstErr, html, normalized };
}

// 智能规范化截图识别回来的公式片段（防重复小问标号、保持行内/块级一致）
function normalizeRecognizedFormula(ocrOut, state, fullSrc) {
  let out = cleanTeXMacroNoise((ocrOut || '').trim());
  if (!out || !state) return out;

  const lineStart = fullSrc.lastIndexOf('\n', state.start - 1) + 1;
  const nlAfter = fullSrc.indexOf('\n', state.end);
  const lineEnd = nlAfter < 0 ? fullSrc.length : nlAfter;
  const preOnLine = fullSrc.slice(lineStart, state.start);
  const postOnLine = fullSrc.slice(state.end, lineEnd);

  // 1. 如果原公式前紧邻小问标号如 "(b) "，而用户截图框选时不小心把 "(b)" 也截进去了，自动剥离重复的 "(b)"
  const subMatch = preOnLine.match(/([（(][a-zA-Z0-9]+[）)])\s*$/);
  if (subMatch) {
    const subLabel = subMatch[1].replace(/[（()）]/g, '').toLowerCase();
    const leadSubRe = new RegExp('^\\s*(?:\\*\\*)?[（(]' + subLabel.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '[）)](?:\\*\\*)?[ \\t]*', 'i');
    if (leadSubRe.test(out)) {
      out = out.replace(leadSubRe, '').trim();
    }
  }

  // 2. 如果原公式是行内公式 ($...$) 且同行前后还有其他文字（如 "(b) "），而识别结果被单行自动包成了 $$\n...\n$$，转回行内 $...$
  const hasInlineNeighbors = preOnLine.trim().length > 0 || postOnLine.trim().length > 0;
  if (!state.displayMode && hasInlineNeighbors) {
    const dispOnlyMatch = out.match(/^\$\$\s*\n?([\s\S]*?)\n?\s*\$\$$/);
    if (dispOnlyMatch && !/\\begin\{/.test(dispOnlyMatch[1]) && !/\\\\/.test(dispOnlyMatch[1])) {
      out = '$' + dispOnlyMatch[1].trim() + '$';
    }
  }

  // 3. 如果模型返回的是不带 $ 的纯公式，自动补齐 $ 或 $$
  if (!out.includes('$')) {
    out = (state.displayMode && !hasInlineNeighbors) ? ('$$\n' + out + '\n$$') : ('$' + out + '$');
  }

  return out;
}

function updateFormulaModalPreview() {
  if (!_fmlState) return { ok: false };
  const raw = $('fmlSrc').value;
  const res = validateAndRenderFormulaSnippet(raw, _fmlState.displayMode);
  const errBar = $('fmlErrBar');
  const errMsgEl = $('fmlErrMsg');
  const macroBtn = $('fmlMacroBtn');
  const badge = $('fmlValidBadge');
  const prevBox = $('fmlPrevBox');

  if (prevBox) prevBox.innerHTML = res.html;

  if (res.ok) {
    if (errBar) {
      errBar.classList.add('ok-bar');
      errMsgEl.textContent = '✓ 公式校验已通过，按 Enter 或点击下方「插入对应部分」即可写回';
    }
    if (macroBtn) macroBtn.style.display = 'none';
    if (badge) badge.innerHTML = '<span class="ok" style="font-weight:600">✓ 公式渲染通过</span>';
  } else {
    if (errBar) {
      errBar.classList.remove('ok-bar');
      const cleanErr = (res.errMsg || _fmlState.errMsg || '公式语法未通过').replace(/^KaTeX parse error:\s*/i, '');
      errMsgEl.textContent = '⚠️ 报错原因：' + cleanErr;
    }
    if (macroBtn) {
      macroBtn.style.display = hasTeXMacroNoise(raw) ? 'inline-block' : 'none';
    }
    if (badge) badge.innerHTML = '<span class="bad" style="cursor:default">× 公式仍未通过</span>';
  }
  return res;
}

function highlightActiveBadInPreview(head, targetIdx) {
  document.querySelectorAll('.bad.bad-editing-active').forEach(el => el.classList.remove('bad-editing-active'));
  if (!head) return;
  const prevBox = $('prev');
  if (prevBox) {
    const rec = previewNodes.get(head);
    const qEl = (rec && rec.el) || prevBox.querySelector('.q[data-head="' + CSS.escape(head) + '"]');
    if (qEl) {
      const bads = qEl.querySelectorAll('.bad');
      const activeBad = bads[Math.min(Math.max(0, targetIdx), Math.max(0, bads.length - 1))];
      if (activeBad) {
        activeBad.classList.add('bad-editing-active');
        const boxRect = prevBox.getBoundingClientRect();
        const elRect = activeBad.getBoundingClientRect();
        if (elRect.top < boxRect.top + 36 || elRect.bottom > boxRect.bottom - 36) {
          const scrollTarget = (elRect.top - boxRect.top) + prevBox.scrollTop - (prevBox.clientHeight / 2) + (elRect.height / 2);
          prevBox.scrollTo({ top: Math.max(0, scrollTarget), behavior: 'smooth' });
        }
      }
    }
  }
  const edPrevBox = $('edPrev');
  if (edPrevBox) {
    const edBads = edPrevBox.querySelectorAll('.bad');
    const activeEdBad = edBads[Math.min(Math.max(0, targetIdx), Math.max(0, edBads.length - 1))];
    if (activeEdBad) activeEdBad.classList.add('bad-editing-active');
  }
}

function closeFormulaModal() {
  document.querySelectorAll('.bad.bad-editing-active').forEach(el => el.classList.remove('bad-editing-active'));
  const mask = $('fmlModalMask');
  if (mask) {
    mask.classList.remove('on');
    mask.style.visibility = 'visible';
  }
}
window.closeFormulaModal = closeFormulaModal;

function openFormulaModal(head, badIdx = 0, badEl = null) {
  if (head && head !== edHead) {
    openEditor(head, 'src', badIdx);
  }
  const ta = $('edSrc');
  if (!ta || !edHead) return;

  const src = ta.value;
  const ranges = findBadFormulaRanges(src);
  if (!ranges.length) return;

  // 优先按 badEl 携带的公式源码精确对齐，确保在任何复杂场景下 100% 命中对应公式
  let targetIdx = Math.min(Math.max(0, badIdx), ranges.length - 1);
  if (badEl && badEl.dataset && badEl.dataset.tex) {
    const targetTex = badEl.dataset.tex;
    let bestDist = Infinity;
    ranges.forEach((r, idx) => {
      if (r.body === targetTex) {
        const dist = Math.abs(idx - badIdx);
        if (dist < bestDist) {
          bestDist = dist;
          targetIdx = idx;
        }
      }
    });
  }

  const r = ranges[targetIdx];
  _fmlState = {
    head: edHead,
    idx: targetIdx,
    total: ranges.length,
    start: r.start,
    end: r.end,
    origRaw: r.raw,
    displayMode: r.displayMode,
    errMsg: (badEl && badEl.dataset && badEl.dataset.err) || r.errMsg || 'KaTeX 语法错误',
    imgData: '',
    busy: false
  };

  focusBadFormulaInEdSrc(targetIdx, true);
  highlightActiveBadInPreview(edHead, targetIdx);

  if ($('fmlModalHead')) $('fmlModalHead').textContent = '· ' + edHead;
  if ($('fmlStepTxt')) $('fmlStepTxt').textContent = `第 ${targetIdx + 1}/${ranges.length} 处`;
  if ($('fmlPrevBad')) $('fmlPrevBad').disabled = ranges.length <= 1;
  if ($('fmlNextBad')) $('fmlNextBad').disabled = ranges.length <= 1;

  // 构建所在行上下文提示
  const lineStart = src.lastIndexOf('\n', r.start - 1) + 1;
  const nlAfter = src.indexOf('\n', r.end);
  const lineEnd = nlAfter < 0 ? src.length : nlAfter;
  const pre = src.slice(lineStart, r.start).trim();
  const post = src.slice(r.end, lineEnd).trim();
  if ($('fmlCtxBar')) {
    if (pre || post) {
      $('fmlCtxBar').innerHTML = `所在行位置：${pre ? '<code>' + esc(pre.slice(-42)) + ' </code>' : ''}<span class="fml-ctx-tag">[当前待替换公式]</span>${post ? '<code> ' + esc(post.slice(0, 42)) + '</code>' : ''}`;
    } else {
      $('fmlCtxBar').innerHTML = `所在行位置：<span class="fml-ctx-tag">[独占一行块级公式 $$...$$]</span>`;
    }
  }

  if ($('fmlSrc')) $('fmlSrc').value = r.raw;
  if ($('fmlBodyGrid')) $('fmlBodyGrid').classList.remove('has-shot');
  if ($('fmlShotImg')) $('fmlShotImg').removeAttribute('src');
  if ($('fmlRetryBtn')) { $('fmlRetryBtn').disabled = true; $('fmlRetryBtn').classList.remove('busy'); }
  if ($('fmlShotBtn')) $('fmlShotBtn').disabled = false;
  if ($('fmlStateMsg')) $('fmlStateMsg').textContent = '';

  updateFormulaModalPreview();

  const mask = $('fmlModalMask');
  if (mask) {
    mask.style.visibility = 'visible';
    mask.classList.add('on');
  }
  setTimeout(() => {
    if ($('fmlSrc')) {
      $('fmlSrc').focus();
      try { $('fmlSrc').setSelectionRange(0, $('fmlSrc').value.length); } catch (_) {}
    }
  }, 30);
}
window.openFormulaModal = openFormulaModal;

// 将公式编辑区弹窗中的新公式写回对应部分并立即刷新预览与保存
function applyFormulaModalEdit(customFormula) {
  if (!_fmlState || !edHead) return false;
  const ta = $('edSrc');
  if (!ta) return false;

  const rawInput = (customFormula !== undefined ? customFormula : $('fmlSrc').value).trim();
  if (!rawInput) {
    if ($('fmlStateMsg')) $('fmlStateMsg').innerHTML = '<span class="bad" style="cursor:default">公式内容不能为空</span>';
    return false;
  }

  const check = validateAndRenderFormulaSnippet(rawInput, _fmlState.displayMode);
  const finalFormula = check.normalized || rawInput;

  window.recordUndo('公式替换 ' + edHead);
  const v = ta.value;
  const a = _fmlState.start, b = _fmlState.end;
  ta.focus({ preventScroll: true });
  try { ta.setSelectionRange(a, b); } catch (_) {}
  if (!document.execCommand('insertText', false, finalFormula)) {
    ta.value = v.slice(0, a) + finalFormula + v.slice(b);
  }
  try { ta.setSelectionRange(a, a + finalFormula.length); } catch (_) {}

  // 立即同步右侧实时预览、核对状态、清洗后全文与左侧全篇渲染区
  clearTimeout(edTimer);
  edTimer = null;
  edRender();
  edCheck(true);

  const t = normText(), range = blockRange(t, edHead);
  if (range) {
    const crlf = /\r\n/.test($('dst').value);
    let nt = t.slice(0, range[0]) + ta.value.replace(/\n+$/, '') + '\n\n' + t.slice(range[1]);
    nt = nt.replace(/\n{3,}/g, '\n\n');
    $('dst').value = crlf ? nt.replace(/\n/g, '\r\n') : nt;
    last = $('dst').value;
    $('dl').disabled = $('copy').disabled = $('save').disabled = false;
    window.syncUndoBase();
    clearTimeout(editTimer);
    preview(last, typeof katex !== 'undefined' ? katex : null);
    if (typeof window.triggerProjectAutoSave === 'function') window.triggerProjectAutoSave();
    const st = $('edStatus');
    if (st && !st.innerHTML.includes('自动写回')) {
      const now = new Date().toLocaleTimeString('zh-CN', { hour12: false });
      st.insertAdjacentHTML('beforeend', ` <span class="hint" style="color:var(--mute,#64748b);font-size:12px;margin-left:8px">（已替换公式并写回全文 ${now} ✓）</span>`);
    }
  }

  closeFormulaModal();
  return true;
}

// 弹窗内截图/粘贴图片的 OCR 识别与自动插入替换
async function recognizeFormulaInModal() {
  if (!_fmlState || !_fmlState.imgData || _fmlState.busy) return;
  _fmlState.busy = true;
  if ($('fmlRetryBtn')) { $('fmlRetryBtn').disabled = true; $('fmlRetryBtn').classList.add('busy'); }
  if ($('fmlShotBtn')) $('fmlShotBtn').disabled = true;
  if ($('fmlStateMsg')) $('fmlStateMsg').innerHTML = '<span style="color:var(--acc);font-weight:600">⏳ 正在识别截图公式…</span>';

  try {
    const fullSrc = $('edSrc') ? $('edSrc').value : '';
    const r = await mdFetch('/api/md/recognize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        image: _fmlState.imgData,
        context: fullSrc,
        selection: _fmlState.origRaw
      })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.ok === false) throw new Error(j.error || ('HTTP ' + r.status));

    const k = typeof katex !== 'undefined' ? katex : null;
    const cleaned = MdCleaner.clean(j.markdown + '\n', { reorder: false, noise: false, tag: true, ids: false }, k).result.trim();
    if (!cleaned) throw new Error('模型未返回有效公式');

    const normalizedOut = normalizeRecognizedFormula(cleaned, _fmlState, fullSrc);
    if ($('fmlSrc')) $('fmlSrc').value = normalizedOut;
    const check = updateFormulaModalPreview();

    const autoInsert = $('fmlAutoInsert') ? $('fmlAutoInsert').checked : true;
    if (autoInsert && check.ok) {
      if ($('fmlStateMsg')) $('fmlStateMsg').innerHTML = '<span class="ok" style="font-weight:600">✓ 识别通过，已自动插入替换！</span>';
      applyFormulaModalEdit(normalizedOut);
      return;
    } else if (check.ok) {
      if ($('fmlStateMsg')) $('fmlStateMsg').innerHTML = '<span class="ok" style="font-weight:600">✓ 识别成功，按 Enter 插入替换</span>';
    } else {
      if ($('fmlStateMsg')) $('fmlStateMsg').innerHTML = '<span class="warn" style="font-weight:600">⚠️ 识别结果仍需微调，请确认后插入</span>';
    }
  } catch (e) {
    if ($('fmlStateMsg')) $('fmlStateMsg').innerHTML = `<span class="bad" style="cursor:default">识别失败：${esc(e.message)}</span>`;
  } finally {
    if (_fmlState) _fmlState.busy = false;
    if ($('fmlRetryBtn')) { $('fmlRetryBtn').disabled = !(_fmlState && _fmlState.imgData); $('fmlRetryBtn').classList.remove('busy'); }
    if ($('fmlShotBtn')) $('fmlShotBtn').disabled = false;
  }
}

async function fmlModalSetImage(file) {
  if (!file || !/^image\//.test(file.type) || !_fmlState) return;
  try {
    const dataUrl = await shrinkImg(file);
    _fmlState.imgData = dataUrl;
    if ($('fmlShotImg')) $('fmlShotImg').src = dataUrl;
    if ($('fmlBodyGrid')) $('fmlBodyGrid').classList.add('has-shot');
    if ($('fmlRetryBtn')) $('fmlRetryBtn').disabled = false;
    await recognizeFormulaInModal();
  } catch (e) {
    if ($('fmlStateMsg')) $('fmlStateMsg').innerHTML = `<span class="bad" style="cursor:default">${esc(e.message)}</span>`;
  }
}
window.fmlModalSetImage = fmlModalSetImage;

// 初始化公式编辑区弹窗的各项事件绑定
(function initFormulaModalEvents() {
  const mask = $('fmlModalMask');
  const modal = $('fmlModal');
  if (!mask || !modal) return;

  const autoChk = $('fmlAutoInsert');
  if (autoChk) {
    try {
      const saved = localStorage.getItem('md_fml_auto_insert');
      if (saved !== null) autoChk.checked = saved !== '0';
    } catch (_) {}
    autoChk.onchange = () => {
      try { localStorage.setItem('md_fml_auto_insert', autoChk.checked ? '1' : '0'); } catch (_) {}
    };
  }

  if ($('fmlCloseBtn')) $('fmlCloseBtn').onclick = closeFormulaModal;
  if ($('fmlCancelBtn')) $('fmlCancelBtn').onclick = closeFormulaModal;

function getBadFormulaHeads() {
  const set = new Set();
  if (window.issueMap && window.issueMap.size) {
    window.issueMap.forEach((why, head) => {
      if (fixedSet.has(head)) return;
      const rec = previewNodes.get(head);
      if (rec && rec.done && !rec.bad && why && why.every(w => w === '公式没通过')) return;
      if (!why || !why.length || why.some(w => /公式没通过|\$ 不配对|裸露/.test(w))) {
        set.add(head);
      }
    });
  }
  // 兜底：若用户在编辑时临时把某道题的公式改坏了，也实时计入
  previewNodes.forEach((rec, head) => {
    if (rec && rec.done && rec.bad && !fixedSet.has(head)) {
      set.add(head);
    }
  });
  if (previewNodes.size) {
    const ordered = [];
    previewNodes.forEach((_, head) => {
      if (set.has(head)) {
        ordered.push(head);
        set.delete(head);
      }
    });
    set.forEach(h => ordered.push(h));
    return ordered;
  }
  return [...set];
}

// 按顺序获取下一道有公式错误的题号（若当前题刚被修好，自动顺延到文档顺序的下一道错题）
function getNextBadFormulaHead(currentHead) {
  const badHeads = getBadFormulaHeads();
  if (!badHeads.length) return null;
  if (!currentHead) return badHeads[0];
  const exactIdx = badHeads.indexOf(currentHead);
  if (exactIdx >= 0) {
    return badHeads[(exactIdx + 1) % badHeads.length];
  }
  let passedCurrent = false;
  for (const [h] of previewNodes) {
    if (h === currentHead) { passedCurrent = true; continue; }
    if (passedCurrent && badHeads.includes(h)) return h;
  }
  return badHeads[0];
}

const hashStr = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return h; };

function preview(md, k){

  const tryRender = (src, disp) => {

    } catch(e) {
      const errMsg = (e && e.message) ? String(e.message).split('\n')[0] : 'KaTeX 语法错误';

    }

      if (c === '\\' && line[i+1] === '|') { cur += '|'; i++; continue; }
