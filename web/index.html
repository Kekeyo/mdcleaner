    let rec = previewNodes.get(head);
    if (!rec) { rec = { el: document.createElement('div'), hash: 0, bad: false, done: false }; rec.el.className = 'q'; rec.el.id = 'q-' + head; rec.el.dataset.head = head; previewNodes.set(head, rec); }
    rec.el.dataset.head = head;
    live.add(head);
    if (rec.done && rec.hash === hash) { frag.appendChild(rec.el); if (rec.bad) errs++; return; }   // 没变：复用，不重渲染
    rec.hash = hash; rec.done = false; rec.bad = false; rec.el.textContent = '…';
    frag.appendChild(rec.el); jobs.set(rec.el, { block: b, head, rec });
  });
  if (tailText) {
    const t = document.createElement('div');
    t.className = 'q tail';
    t.innerHTML = '<button class="q-del-btn tail-del-btn" type="button" title="从文档中彻底删除末尾此段内容" data-type="tail">×</button>' + bodyHtml(tailText);
    frag.appendChild(t);
  }
  previewNodes.forEach((rec, h) => { if (!live.has(h)) previewNodes.delete(h); });                 // 换文件时清掉旧的

  if (prevObs) { prevObs.disconnect(); prevObs = null; }
  box.className = ''; box.replaceChildren(frag); box.scrollTop = scrollTop;

  const errTail = () => {
    const badHeads = getBadFormulaHeads();
    const errN = badHeads.length;
    if (!errN) return '';
    const curIdx = edHead ? badHeads.indexOf(edHead) : -1;
    const stepStr = curIdx >= 0 ? `<span class="err-step">(${curIdx + 1}/${errN})</span>` : '';
    return ` · <span class="err-nav-wrap" title="点击右箭头按顺序逐题指向有公式错误的题目，并在右侧编辑区同步打开直接修改"><span class="err-nav-txt">${errN} 题有公式错误${stepStr}</span><button type="button" class="err-next-btn" aria-label="下一道公式错误题目">▶</button></span>`;
  };
  const finish = () => {
    if (token !== previewToken) return;
    const errN = getBadFormulaHeads().length;
    status.innerHTML = `已渲染全部 ${total} 题${errTail()}`;
    status.className = errN ? 'bad' : 'ok';
    if (typeof window.refreshZoneBadges === 'function') window.refreshZoneBadges();
  };
  const renderJob = j => {
    const nl = j.block.indexOf('\n');
    const bodyContent = nl >= 0 ? j.block.slice(nl + 1) : '';
    j.rec.el.innerHTML = '<button class="q-del-btn" type="button" title="从文档中彻底删除这道题 (' + esc(j.head) + ')" data-head="' + esc(j.head) + '">×</button><h3>' + inlineHtml(j.head) + '</h3>' + bodyHtml(bodyContent);
    j.rec.done = true; j.rec.bad = !!j.rec.el.querySelector('.bad'); if (j.rec.bad) errs++;
  };
  window._previewCtx = {
    token, jobs, renderJob, prevObs: null, box, total, status, errTail, finish,
    updateStatus: () => {
      if (token !== previewToken) return;
      const doneN = total - jobs.size;
      const errN = getBadFormulaHeads().length;
      status.innerHTML = jobs.size ? `已渲染 ${doneN}/${total} 题（滚动继续）${errTail()}` : `已渲染全部 ${total} 题${errTail()}`;
      status.className = errN ? 'bad' : (jobs.size ? 'hint' : 'ok');
      if (typeof window.refreshZoneBadges === 'function') window.refreshZoneBadges();
    }
  };
  if (!jobs.size) { finish(); return; }             // 全都没变：秒出
  // 兜底：先把开头 24 道题以及当前正在编辑的题目渲染出来，保证立刻有内容；其余滚到跟前再渲染
  let pre = 0;
  for (const [el, j] of jobs) {
    if (pre < 24 || (edHead && j.head === edHead)) {
      pre++;
      jobs.delete(el);
      renderJob(j);
    }
  }
  if (!jobs.size) { finish(); return; }
  window._previewCtx.updateStatus();

  // 滚动到跟前才渲染（root 就是预览框本身）
  prevObs = new IntersectionObserver(ents => {
    if (token !== previewToken) return;
    let hit = 0;
    for (const en of ents) {
      if (!en.isIntersecting) continue;
      const j = jobs.get(en.target); if (!j) continue;
      jobs.delete(en.target); prevObs.unobserve(en.target); renderJob(j); hit++;
    }
    if (!hit) return;
    window._previewCtx.updateStatus();
  }, { root: box, rootMargin: '1200px 0px' });
  window._previewCtx.prevObs = prevObs;
  jobs.forEach((j, el) => prevObs.observe(el));
}

window.getPreviewQuestionHeads = function() {
  const text = (window.last || $('dst').value || '').replace(/\r\n/g, '\n');
  if (!text.trim()) return [];

  const lines = text.split('\n');
  const items = [];
  const seen = new Set();
  let curSec = '';

  lines.forEach((line, idx) => {
    // 匹配 1 到 4 级 Markdown 标题（支持 # 习题 5.1 等一级标题格式）
    const m = line.match(/^\s*(#{1,4})\s+(.+)$/);
    if (!m) return;
    const lvl = m[1].length;
    const raw = m[2].replace(/\s*\{#[^}]+\}\s*$/, '').trim();
    if (!raw || seen.has(raw)) return;

    let qNo = '';
    // 1. 优先提取带“习题”的小数/整数编号（如 "习题 5.2" -> "5.2"）
    const xiTiM = raw.match(/习题\s*(\d+(?:\.\d+)?|\d+)/i);
    // 2. 提取开头的章节编号（如 "11.60"、"11.60(a)"）或常规题号（如 "19. （12分）"、"第19题"）
    const numM = raw.match(/^(\d+\.\d+(?:\([a-z]\))?)/i) || raw.match(/^(\d+)[.、\s]/) || raw.match(/^第?\s*(\d+)\s*题/);

    if (xiTiM) {
      qNo = xiTiM[1];
    } else if (numM) {
      qNo = numM[1];
    } else {
      const secM = raw.match(/^([一二三四五六七八九十]+[、\s][^（(]+)/);
      if (secM) qNo = secM[1].trim();
    }

    // 过滤一级标题中的纯章节名/总标题（如 "# 第5章 流水线技术" 记录为大章节，不单列为题目）
    if (lvl === 1 && !qNo && !raw.includes('题')) {
      curSec = raw.slice(0, 24);
      return;
    }

    seen.add(raw);

    if ((lvl === 3 || lvl === 2) && raw.includes('题') && !qNo) {
      curSec = raw.replace(/（[^）]*）|\([^)]*\)/g, '').trim();
    }

    const isSub = lvl >= 4 || (lvl === 3 && numM && !raw.includes('共') && !raw.includes('小题，'));
    let label = raw;
    if (raw.length > 28) {
      label = raw.slice(0, 26) + '…';
    }

    items.push({
      head: raw,
      label,
      qNo,
      lvl,
      isSub,
      section: curSec,
      bad: !!(window.issueMap && window.issueMap.has(raw) && !fixedSet.has(raw))
    });
  });

  return items;
};

window.jumpToPreviewHead = function(query) {
  if (!query || typeof query !== 'string') return { ok: false, msg: '请输入题号' };
  const raw = query.trim().replace(/^#{1,6}\s*/, '').trim();
  if (!raw) return { ok: false, msg: '题号不能为空' };

  const all = window.getPreviewQuestionHeads();
  if (!all.length) return { ok: false, msg: '渲染区尚无题目或未清洗' };

  // 提取用户输入的核心数字/编号（支持输入 "习题5.2"、"5.2"、"第19题"、"19"）
  const qClean = raw.replace(/^第\s*/, '').replace(/^习题\s*/i, '').replace(/\s*题$/, '').trim();
  const qNumMatch = raw.match(/(?:习题)?\s*(\d+(?:\.\d+)?|\d+)/i);
  const qNum = qNumMatch ? qNumMatch[1] : qClean;

  const qLow = raw.toLowerCase();
  const qCleanLow = qClean.toLowerCase();
  const normStr = s => s.replace(/[\s\-_()（）[\]【】]/g, '').toLowerCase();
  const qNorm = normStr(raw);
  const qCleanNorm = normStr(qClean);

  // 1. 完全精确匹配（匹配 qNo 或原标题）
  let match = all.find(item => 
    (item.qNo && (item.qNo.toLowerCase() === qLow || item.qNo.toLowerCase() === qCleanLow || item.qNo === qNum)) ||
    item.head.toLowerCase() === qLow ||
    item.head.toLowerCase() === qCleanLow
  );
  if (!match) {
    match = all.find(item => 
      (item.qNo && (normStr(item.qNo) === qNorm || normStr(item.qNo) === qCleanNorm)) ||
      normStr(item.head) === qNorm ||
      normStr(item.head) === qCleanNorm
    );
  }

  // 2. 题号前缀匹配
  if (!match) {
    match = all.find(item => 
      item.qNo && (
        item.qNo.toLowerCase().startsWith(qLow) ||
        item.qNo.toLowerCase().startsWith(qCleanLow) ||
        (qNum && item.qNo.startsWith(qNum))
      )
    );
  }
  if (!match) {
    match = all.find(item => 
      item.head.toLowerCase().startsWith(qLow) ||
      item.head.toLowerCase().startsWith(qCleanLow) ||
      normStr(item.head).startsWith(qNorm) ||
      normStr(item.head).startsWith(qCleanNorm)
    );
  }

  // 3. 包含匹配
  if (!match) {
    match = all.find(item => 
      item.head.toLowerCase().includes(qLow) ||
      item.head.toLowerCase().includes(qCleanLow) ||
      normStr(item.head).includes(qNorm) ||
      normStr(item.head).includes(qCleanNorm)
    );
  }

  if (!match) return { ok: false, msg: `未找到题号 “${raw}”` };

  // 若处于折叠状态，先展开“渲染区”
  if (typeof window.openZone === 'function') {
    window.openZone('sec-render');
  } else {
    const z = document.getElementById('sec-render');
    if (z && z.classList.contains('collapsed')) z.classList.remove('collapsed');
  }

  // 寻找所属的大卡片 block
  let parentRec = previewNodes.get(match.head);
  if (!parentRec) {
    for (const [h, r] of previewNodes) {
      if (h.trim() === match.head.trim() || (match.qNo && h.startsWith(match.qNo))) {
        parentRec = r;
        break;
      }
    }
  }
  if (!parentRec && window._previewCtx) {
    previewNodes.forEach((r, h) => {
      if (parentRec) return;
      const j = window._previewCtx.jobs && window._previewCtx.jobs.get(r.el);
      if (j && j.block && j.block.includes(match.head)) {
        parentRec = r;
      } else if (r.el && r.el.textContent.includes(match.head)) {
        parentRec = r;
      }
    });
  }

  // 核心突破：强制渲染从第1道题到目标卡片（含目标后2题）的所有未完成卡片
  // 必须把前置所有占位卡片（原先仅20px）全部真实展开，彻底消除滚动途中被撑开导致的漂移（解决跳2.44停在2.2的问题）
  const prevBox = document.getElementById('prev');
  if (prevBox && window._previewCtx && window._previewCtx.jobs && window._previewCtx.jobs.size > 0) {
    const ctx = window._previewCtx;
    const children = Array.from(prevBox.children);
    let foundTarget = false;
    let extraCount = 0;
    for (const child of children) {
      if (foundTarget) {
        if (++extraCount > 2) break;
      }
      const j = ctx.jobs.get(child);
      if (j) {
        ctx.jobs.delete(child);
        if (ctx.prevObs) {
          try { ctx.prevObs.unobserve(child); } catch (_) {}
        }
        ctx.renderJob(j);
      }
      if (child === (parentRec && parentRec.el)) {
        foundTarget = true;
      }
    }
    if (ctx.updateStatus) ctx.updateStatus();
  }

  // 在已真实渲染的 DOM 中定位目标标题元素
  let targetEl = null;
  if (prevBox) {
    const escapedHead = match.head.replace(/"/g, '\\"');
    targetEl = prevBox.querySelector(`[data-heading="${escapedHead}"]`);
    if (!targetEl) {
      const hid = 'hd-' + hashStr(match.head);
      targetEl = document.getElementById(hid);
    }
    if (!targetEl && parentRec && parentRec.el) {
      const hs = parentRec.el.querySelectorAll('h1,h2,h3,h4,h5,h6');
      for (const h of hs) {
        if (h.textContent.includes(match.head) || (match.qNo && h.textContent.includes(match.qNo))) {
          targetEl = h;
          break;
        }
      }
    }
  }

  if (!targetEl && parentRec && parentRec.el) {
    targetEl = parentRec.el;
  }

  if (!targetEl) return { ok: false, msg: `定位题目元素失败` };

  // 1. 精准将“渲染区”外框头部对齐至视口顶部（留 8px 边距），若已在打顶位置则完全静止不滑动
  const zone = document.getElementById('sec-render');
  if (zone) {
    const rectTop = zone.getBoundingClientRect().top;
    if (Math.abs(rectTop - 8) > 4) {
      const zoneTop = rectTop + window.scrollY;
      window.scrollTo({
        top: Math.max(0, zoneTop - 8),
        behavior: 'smooth'
      });
    }
  }

  // 2. 内部滚动：若题目内存在 [公式没通过] (.bad)，智能跳转到该错误公式可见处并脉冲高亮
  if (prevBox && targetEl) {
    const qCard = targetEl.closest('.q') || (parentRec && parentRec.el);
    const badEl = qCard ? qCard.querySelector('.bad') : null;

    const calcFinalTop = () => {
      const boxRect = prevBox.getBoundingClientRect();
      const currentScrollTop = prevBox.scrollTop;
      const headRect = targetEl.getBoundingClientRect();
      const headTopInBox = (headRect.top - boxRect.top) + currentScrollTop;

      if (badEl) {
        const badRect = badEl.getBoundingClientRect();
        const badTopInBox = (badRect.top - boxRect.top) + currentScrollTop;
        if (badTopInBox - headTopInBox > prevBox.clientHeight * 0.55) {
          return Math.max(0, badTopInBox - Math.round(prevBox.clientHeight * 0.38));
        }
      }
      return Math.max(0, headTopInBox - 10);
    };

    const performScroll = () => {
      const currentScrollTop = prevBox.scrollTop;
      const finalTop = calcFinalTop();

      // 若跨度较大，先瞬移至目标附近，再平滑停稳，避免长距离 smooth 滚动被浏览器丢帧
      const dist = Math.abs(finalTop - currentScrollTop);
      if (dist > 800) {
        prevBox.scrollTop = finalTop > currentScrollTop ? finalTop - 50 : finalTop + 50;
      }
      prevBox.scrollTo({
        top: finalTop,
        behavior: 'smooth'
      });
    };

    performScroll();

    // 次级校准：在 150ms 检查微小布局重排，确保 100% 精准定位并触发高亮
    setTimeout(() => {
      const finalTop = calcFinalTop();
      if (Math.abs(prevBox.scrollTop - finalTop) > 2) {
        prevBox.scrollTop = finalTop;
      }

      const hlTarget = targetEl.closest('.q') || targetEl;
      hlTarget.classList.remove('q-jump-target');
      void hlTarget.offsetWidth;
      hlTarget.classList.add('q-jump-target');

      if (badEl) {
        badEl.classList.remove('bad-jump-focus');
        void badEl.offsetWidth;
        badEl.classList.add('bad-jump-focus');
      }
    }, 150);
  }

  return { ok: true, head: match.head, qNo: match.qNo };
};

// ---- 原文与清洗后：题号同行双联滚动对比 (Heading-Anchored Zero-Jank Sync Scroll)
(function setupSyncScroll() {
  const src = $('src');
  const dst = $('dst');
  const chk = $('syncScroll');
  if (!src || !dst) return;

  let syncEnabled = true;
  try {
    const saved = localStorage.getItem('md_sync_scroll');
    if (saved !== null) {
      syncEnabled = saved !== '0';
      if (chk) chk.checked = syncEnabled;
    }
  } catch (_) {}

  if (chk) {
    chk.onchange = () => {
      syncEnabled = chk.checked;
      try { localStorage.setItem('md_sync_scroll', syncEnabled ? '1' : '0'); } catch (_) {}
    };
  }

  // 物理交互锁定：通过鼠标悬停 / 聚焦 / 触摸识别真正的主动方，彻底杜绝回环死锁
  let activeSource = null;
  let isProgrammatic = false;
  let rafId = 0;

  const setActive = el => { activeSource = el; };
  src.addEventListener('mouseenter', () => setActive(src));
  dst.addEventListener('mouseenter', () => setActive(dst));
  src.addEventListener('focus', () => setActive(src));
  dst.addEventListener('focus', () => setActive(dst));
  src.addEventListener('touchstart', () => setActive(src), { passive: true });
  dst.addEventListener('touchstart', () => setActive(dst), { passive: true });

  // 题号锚点映射表缓存
  let anchorMap = null;
  let isMapDirty = true;

  window.markSyncDirty = function() {
    isMapDirty = true;
  };

  src.addEventListener('input', window.markSyncDirty);
  dst.addEventListener('input', window.markSyncDirty);

  // 识别各类题号标题行（支持 # 习题 5.5、### 5.5、## 习题 5-5、# 5.5 等）
  const headingRegex = /^[ \t]*#{1,4}[ \t]+(?:(?:第\s*)?(?:习题|例题|题)\s*)?([0-9]+(?:[\.\-][0-9]+)*)/gim;

  function extractHeadings(text) {
    const list = [];
    headingRegex.lastIndex = 0;
    let m;
    while ((m = headingRegex.exec(text)) !== null) {
      const qNo = m[1].replace(/-/g, '.');
      list.push({ qNo, index: m.index, raw: m[0] });
    }
    return list;
  }

  function measureTops(ta, indices) {
    if (!indices || !indices.length) return [];
    let mirror = document.getElementById('md-scroll-mirror');
    if (!mirror) {
      mirror = document.createElement('div');
      mirror.id = 'md-scroll-mirror';
      mirror.style.position = 'fixed';
      mirror.style.top = '-99999px';
      mirror.style.left = '-99999px';
      mirror.style.visibility = 'hidden';
      mirror.style.whiteSpace = 'pre-wrap';
      mirror.style.wordBreak = 'break-word';
      mirror.style.overflowWrap = 'break-word';
      mirror.style.boxSizing = 'border-box';
      document.body.appendChild(mirror);
    }

    const cs = window.getComputedStyle(ta);
    const padLeft = parseFloat(cs.paddingLeft) || 0;
    const padRight = parseFloat(cs.paddingRight) || 0;
    // 关键修正：确保镜像内容宽度与 textarea 内部文字真实排版宽度严格 1:1 一致，杜绝误差折行
    const contentWidth = Math.max(0, ta.clientWidth - padLeft - padRight);
    mirror.style.boxSizing = 'content-box';
    mirror.style.width = contentWidth + 'px';
    mirror.style.padding = '0';
    mirror.style.border = '0';
    mirror.style.margin = '0';
    mirror.style.whiteSpace = 'pre-wrap';
    mirror.style.wordBreak = 'break-word';
    mirror.style.overflowWrap = 'break-word';

    // 字体、字号、字重、行高与间距 1:1 像素级复制
    mirror.style.fontFamily = cs.fontFamily;
    mirror.style.fontSize = cs.fontSize;
    mirror.style.fontWeight = cs.fontWeight;
    mirror.style.lineHeight = cs.lineHeight;
    mirror.style.letterSpacing = cs.letterSpacing;
    mirror.style.wordSpacing = cs.wordSpacing;
    mirror.style.tabSize = cs.tabSize;

    const text = ta.value;
    let html = '';
    let lastPos = 0;
    indices.forEach((idx, i) => {
      const chunk = text.slice(lastPos, idx);
      html += chunk.replace(/[&<]/g, c => c === '&' ? '&amp;' : '&lt;');
      // 关键修正：让 span 包含标题行首字符，生成物理真实的行盒基线定位
      const ch = text[idx] || '#';
      const safeCh = ch === '<' ? '&lt;' : (ch === '&' ? '&amp;' : ch);
      html += `<span id="m-mark-${i}" style="display:inline-block;height:0;overflow:visible">${safeCh}</span>`;
      lastPos = idx + 1;
    });
    html += text.slice(lastPos).replace(/[&<]/g, c => c === '&' ? '&amp;' : '&lt;');
    mirror.innerHTML = html;

    const tops = [];
    indices.forEach((idx, i) => {
      const span = mirror.querySelector(`#m-mark-${i}`);
      // mirror 无 padding，span.offsetTop 即为该题首字相较于文本第一行顶部的绝对物理像素位移
      tops.push(span ? Math.max(0, span.offsetTop) : 0);
    });
    return tops;
  }

  function getAnchorMap() {
    if (!isMapDirty && anchorMap) return anchorMap;

    const srcText = src.value;
    const dstText = dst.value;
    const maxSrc = src.scrollHeight - src.clientHeight;
    const maxDst = dst.scrollHeight - dst.clientHeight;

    if (!srcText.trim() || !dstText.trim() || maxSrc <= 0 || maxDst <= 0) {
      anchorMap = null;
      isMapDirty = false;
      return null;
    }

    const srcList = extractHeadings(srcText);
    const dstList = extractHeadings(dstText);

    const dstLookup = new Map();
    for (const item of dstList) {
      if (!dstLookup.has(item.qNo)) dstLookup.set(item.qNo, item);
    }

    const commonPairs = [];
    for (const s of srcList) {
      if (dstLookup.has(s.qNo)) {
        commonPairs.push({
          qNo: s.qNo,
          srcIdx: s.index,
          dstIdx: dstLookup.get(s.qNo).index
        });
      }
    }

    if (!commonPairs.length) {
      anchorMap = null;
      isMapDirty = false;
      return null;
    }

    const srcTops = measureTops(src, commonPairs.map(p => p.srcIdx));
    const dstTops = measureTops(dst, commonPairs.map(p => p.dstIdx));

    const anchors = [{ qNo: 'START', srcTop: 0, dstTop: 0 }];
    for (let i = 0; i < commonPairs.length; i++) {
      anchors.push({
        qNo: commonPairs[i].qNo,
        srcTop: Math.min(srcTops[i], maxSrc),
        dstTop: Math.min(dstTops[i], maxDst)
      });
    }
    anchors.push({ qNo: 'END', srcTop: maxSrc, dstTop: maxDst });

    // 确保绝对单调递增
    for (let i = 1; i < anchors.length; i++) {
      if (anchors[i].srcTop < anchors[i - 1].srcTop) anchors[i].srcTop = anchors[i - 1].srcTop;
      if (anchors[i].dstTop < anchors[i - 1].dstTop) anchors[i].dstTop = anchors[i - 1].dstTop;
    }

    anchorMap = anchors;
    isMapDirty = false;
    return anchorMap;
  }

  // 分段插值映射滚动距离：两边各题号绝对严格同行对齐
  function interpolateScroll(fromVal, fromKey, toKey, anchors, maxFrom, maxTo) {
    if (!anchors || anchors.length < 2) {
      return maxFrom > 0 ? Math.round((fromVal / maxFrom) * maxTo) : 0;
    }

    if (fromVal <= 2) return 0;
    if (fromVal >= maxFrom - 2) return maxTo;

    let low = 0, high = anchors.length - 1;
    while (low <= high) {
      const mid = (low + high) >> 1;
      if (anchors[mid][fromKey] <= fromVal) {
        if (mid === anchors.length - 1 || anchors[mid + 1][fromKey] > fromVal) {
          const a0 = anchors[mid];
          const a1 = anchors[mid + 1];
          const segFrom = a1[fromKey] - a0[fromKey];
          const segTo = a1[toKey] - a0[toKey];
          if (segFrom <= 0) return a0[toKey];
          const ratio = (fromVal - a0[fromKey]) / segFrom;
          return Math.round(a0[toKey] + ratio * segTo);
        }
        low = mid + 1;
      } else {
        high = mid - 1;
      }
    }
    return 0;
  }

  function handleScroll(from, to) {
    if (!syncEnabled || isProgrammatic) return;
    if (activeSource && activeSource !== from) return;

    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(() => {
      const maxFrom = from.scrollHeight - from.clientHeight;
      const maxTo = to.scrollHeight - to.clientHeight;
      if (maxFrom <= 0 || maxTo <= 0) return;

      const anchors = getAnchorMap();
      const isSrc = (from === src);
      const fromKey = isSrc ? 'srcTop' : 'dstTop';
      const toKey = isSrc ? 'dstTop' : 'srcTop';

      const targetTop = interpolateScroll(from.scrollTop, fromKey, toKey, anchors, maxFrom, maxTo);

      if (Math.abs(to.scrollTop - targetTop) >= 1) {
        isProgrammatic = true;
        to.scrollTop = targetTop;
        requestAnimationFrame(() => {
          isProgrammatic = false;
        });
      }
    });
  }

  src.addEventListener('scroll', () => handleScroll(src, dst), { passive: true });
  dst.addEventListener('scroll', () => handleScroll(dst, src), { passive: true });

  // 左右高度拉伸联动与持久化记忆 (ResizeObserver)
  try {
    const savedH = localStorage.getItem('md_box_h');
    if (savedH) {
      const numH = parseInt(savedH, 10);
      const applyH = (!isNaN(numH) && numH >= 480) ? savedH : '480px';
      src.style.height = applyH;
      dst.style.height = applyH;
    } else {
      src.style.height = '480px';
      dst.style.height = '480px';
    }
  } catch (_) {}

  if (window.ResizeObserver) {
    let isResizing = false;
    const ro = new ResizeObserver(entries => {
      window.markSyncDirty();
      if (isResizing) return;
      for (const entry of entries) {
        const targetH = entry.target.offsetHeight;
        isResizing = true;
        if (entry.target === src && Math.abs(dst.offsetHeight - targetH) > 2) {
          dst.style.height = targetH + 'px';
        } else if (entry.target === dst && Math.abs(src.offsetHeight - targetH) > 2) {
          src.style.height = targetH + 'px';
        }
        try { localStorage.setItem('md_box_h', targetH + 'px'); } catch (_) {}
        requestAnimationFrame(() => { isResizing = false; });
      }
    });
    ro.observe(src);
    ro.observe(dst);
  }

  // 快捷按键：上一题 / 下一题精准整题对齐
  function jumpHeading(dir) {
    const anchors = getAnchorMap();
    if (!anchors || anchors.length <= 2) return;
    const curTop = (activeSource === dst ? dst.scrollTop : src.scrollTop);
    const key = (activeSource === dst ? 'dstTop' : 'srcTop');
    const realAnchors = anchors.slice(1, -1);
    if (!realAnchors.length) return;

    let targetIdx = -1;
    if (dir > 0) {
      for (let i = 0; i < realAnchors.length; i++) {
        if (realAnchors[i][key] > curTop + 10) {
          targetIdx = i;
          break;
        }
      }
      if (targetIdx === -1) targetIdx = realAnchors.length - 1;
    } else {
      for (let i = realAnchors.length - 1; i >= 0; i--) {
        if (realAnchors[i][key] < curTop - 10) {
          targetIdx = i;
          break;
        }
      }
      if (targetIdx === -1) targetIdx = 0;
    }

    const tAnchor = realAnchors[targetIdx];
    if (tAnchor) {
      isProgrammatic = true;
      src.scrollTo({ top: tAnchor.srcTop, behavior: 'smooth' });
      dst.scrollTo({ top: tAnchor.dstTop, behavior: 'smooth' });
      setTimeout(() => { isProgrammatic = false; }, 400);
    }
  }

  window.measureTaOffsetTop = function(ta, idx) {
    if (!ta || idx === undefined || idx === null) return 0;
    const tops = measureTops(ta, [idx]);
    return (tops && tops.length) ? tops[0] : 0;
  };

  const btnPrev = $('qPrev');
  const btnNext = $('qNext');
  if (btnPrev) btnPrev.onclick = () => jumpHeading(-1);
  if (btnNext) btnNext.onclick = () => jumpHeading(1);
})();

// ---- MD 区：提取原文与清洗后中的题号列表及跳转定位 ----
window.getMdQuestionHeads = function() {
  const src = $('src');
  const dst = $('dst');
  const text = (src && src.value) || (dst && dst.value) || '';
  if (!text.trim()) return [];

  const lines = text.replace(/\r\n/g, '\n').split('\n');
  const items = [];
  const seen = new Set();
  let curSec = '';
  let charPos = 0;

  lines.forEach((line) => {
    const lineStart = charPos;
    const lineLen = line.length;
    charPos += lineLen + 1;

    const m = line.match(/^\s*(#{1,4})\s+(.+)$/);
    if (!m) return;
    const lvl = m[1].length;
    const raw = m[2].replace(/\s*\{#[^}]+\}\s*$/, '').trim();
    if (!raw || seen.has(raw)) return;

    let qNo = '';
    const xiTiM = raw.match(/习题\s*(\d+(?:\.\d+)?|\d+)/i);
    const numM = raw.match(/^(\d+\.\d+(?:\([a-z]\))?)/i) || raw.match(/^(\d+)[.、\s]/) || raw.match(/^第?\s*(\d+)\s*题/);

    if (xiTiM) {
      qNo = xiTiM[1];
    } else if (numM) {
      qNo = numM[1];
    } else {
      const secM = raw.match(/^([一二三四五六七八九十]+[、\s][^（(]+)/);
      if (secM) qNo = secM[1].trim();
    }

    if (lvl === 1 && !qNo && !raw.includes('题')) {
      curSec = raw.slice(0, 24);
      return;
    }

    seen.add(raw);

    if ((lvl === 3 || lvl === 2) && raw.includes('题') && !qNo) {
      curSec = raw.replace(/（[^）]*）|\([^)]*\)/g, '').trim();
    }

    const isSub = lvl >= 4 || (lvl === 3 && numM && !raw.includes('共') && !raw.includes('小题，'));
    let label = raw;
    if (raw.length > 28) {
      label = raw.slice(0, 26) + '…';
    }

    items.push({
      head: raw,
      label,
      qNo,
      lvl,
      isSub,
      section: curSec,
      index: lineStart,
      lineLength: lineLen,
      bad: false
    });
  });

  return items;
};

window.jumpToMdHead = function(query) {
  if (!query || typeof query !== 'string') return { ok: false, msg: '请输入题号' };
  const raw = query.trim().replace(/^#{1,6}\s*/, '').trim();
  if (!raw) return { ok: false, msg: '题号不能为空' };

  const all = window.getMdQuestionHeads();
  if (!all.length) return { ok: false, msg: '尚未载入 Markdown 原文' };

  const qClean = raw.replace(/^第\s*/, '').replace(/^习题\s*/i, '').replace(/\s*题$/, '').trim();
  const qNumMatch = raw.match(/(?:习题)?\s*(\d+(?:\.\d+)?|\d+)/i);
  const qNum = qNumMatch ? qNumMatch[1] : qClean;

  const qLow = raw.toLowerCase();
  const qCleanLow = qClean.toLowerCase();
  const normStr = s => s.replace(/[\s\-_()（）[\]【】]/g, '').toLowerCase();
  const qNorm = normStr(raw);
  const qCleanNorm = normStr(qClean);

  // 1. 完全精确匹配
  let match = all.find(item => 
    (item.qNo && (item.qNo.toLowerCase() === qLow || item.qNo.toLowerCase() === qCleanLow || item.qNo === qNum)) ||
    item.head.toLowerCase() === qLow ||
    item.head.toLowerCase() === qCleanLow
  );
  if (!match) {
    match = all.find(item => 
      (item.qNo && (normStr(item.qNo) === qNorm || normStr(item.qNo) === qCleanNorm)) ||
      normStr(item.head) === qNorm ||
      normStr(item.head) === qCleanNorm
    );
  }

  // 2. 题号前缀匹配
  if (!match) {
    match = all.find(item => 
      item.qNo && (
        item.qNo.toLowerCase().startsWith(qLow) ||
        item.qNo.toLowerCase().startsWith(qCleanLow) ||
        (qNum && item.qNo.startsWith(qNum))
      )
    );
  }
  if (!match) {
    match = all.find(item => 
      item.head.toLowerCase().startsWith(qLow) ||
      item.head.toLowerCase().startsWith(qCleanLow) ||
      normStr(item.head).startsWith(qNorm) ||
      normStr(item.head).startsWith(qCleanNorm)
    );
  }

  // 3. 包含匹配
  if (!match) {
    match = all.find(item => 
      item.head.toLowerCase().includes(qLow) ||
      item.head.toLowerCase().includes(qCleanLow) ||
      normStr(item.head).includes(qNorm) ||
      normStr(item.head).includes(qCleanNorm)
    );
  }

  if (!match) return { ok: false, msg: `未找到题号 “${raw}”` };

  // 若处于折叠状态，先展开“MD 区”
  if (typeof window.openZone === 'function') {
    window.openZone('sec-md');
  } else {
    const z = document.getElementById('sec-md');
    if (z && z.classList.contains('collapsed')) z.classList.remove('collapsed');
  }

  // 1. 精准将“MD 区”外框头部对齐至视口顶部（留 8px 边距）
  const zone = document.getElementById('sec-md');
  if (zone) {
    const zoneTop = zone.getBoundingClientRect().top + window.scrollY;
    window.scrollTo({
      top: Math.max(0, zoneTop - 8),
      behavior: 'smooth'
    });
  }

  const src = $('src');
  const dst = $('dst');

  // 2. 原文（#src）选区高亮与平滑置顶滚动
  if (src) {
    let srcTop = 0;
    if (typeof window.measureTaOffsetTop === 'function') {
      srcTop = window.measureTaOffsetTop(src, match.index);
    } else {
      const lineCount = src.value.slice(0, match.index).split('\n').length;
      srcTop = Math.max(0, (lineCount - 1) * 20);
    }

    try {
      src.focus();
      src.setSelectionRange(match.index, match.index + match.lineLength);
    } catch (_) {}

    setTimeout(() => {
      src.scrollTo({
        top: Math.max(0, srcTop - 10),
        behavior: 'smooth'
      });
    }, 50);
  }

  // 3. 清洗后（#dst）同步置顶对齐
  if (dst && dst.value) {
    const dstText = dst.value.replace(/\r\n/g, '\n');
    let dstIndex = -1;
    if (match.qNo) {
      const qEsc = match.qNo.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const qReg = new RegExp('^[ \\t]*#{1,4}[ \\t]+(?:(?:第\\s*)?(?:习题|例题|题)\\s*)?' + qEsc, 'im');
      const dm = qReg.exec(dstText);
      if (dm) dstIndex = dm.index;
    }
    if (dstIndex === -1) {
      dstIndex = dstText.indexOf(match.head);
    }

    if (dstIndex >= 0 && typeof window.measureTaOffsetTop === 'function') {
      const dstTop = window.measureTaOffsetTop(dst, dstIndex);
      setTimeout(() => {
        dst.scrollTo({
          top: Math.max(0, dstTop - 10),
          behavior: 'smooth'
        });
      }, 50);
    }
  }

  return { ok: true, head: match.head, qNo: match.qNo };
};

// ---------------- 核对栏：题号搜索与任意题目调出编辑（放大镜组件） ----------------
function mountCheckHeadingSearch() {
  const wrap = $('chkSearch');
  if (!wrap) return;

  const input = $('chkSearchIn');
  const clearBtn = $('chkSearchClear');
  const goBtn = $('chkSearchGo');
  const icBtn = $('chkSearchIc');
  const drop = $('chkSearchDrop');

  let activeIdx = -1;
  let curMatches = [];

  const shake = (msg) => {
    wrap.classList.add('shake');
    const origPh = input.placeholder;
    input.placeholder = msg || '未找到该题号';
    setTimeout(() => {
      wrap.classList.remove('shake');
      input.placeholder = origPh;
    }, 900);
  };

  const closeDrop = () => {
    drop.classList.remove('on');
    drop.innerHTML = '';
    activeIdx = -1;
    curMatches = [];
  };

  const getAllItems = () => {
    const all = (typeof window.getPreviewQuestionHeads === 'function') ? window.getPreviewQuestionHeads() : [];
    const issueMap = window.issueMap;
    return all.map(item => {
      const isIssue = issueMap && (issueMap.has(item.head) || (item.qNo && issueMap.has(item.qNo)));
      const isDone = fixedSet.has(item.head) || (item.qNo && fixedSet.has(item.qNo));
      let why = '';
      if (isIssue) {
        const whys = issueMap.get(item.head) || (item.qNo ? issueMap.get(item.qNo) : null);
        why = whys ? whys.join('；') : '公式待核对';
      }
      return {
        ...item,
        isIssue: !!isIssue,
        isDone: !!isDone,
        why: why
      };
    });
  };

  const renderDrop = () => {
    const all = getAllItems();
    if (!all.length) {
      drop.innerHTML = '<div class="chk-search-tip">尚未清洗或没有找到题目</div>';
      drop.classList.add('on');
      return;
    }

    const raw = input.value.trim().replace(/^#{1,6}\s*/, '').trim();

    if (!raw) {
      curMatches = all.slice(0, 15);
      drop.innerHTML = `<div class="chk-search-tip" style="padding:4px 8px;font-size:11px;border-bottom:1px solid var(--line,#dde1e8);margin-bottom:2px">快速调出题目 (共 ${all.length} 题 · 修改将自动保存)</div>` +
        curMatches.map((item, idx) => {
          const tagClass = item.isDone ? 'done' : (item.isIssue ? 'bad' : '');
          const tagText = item.isDone ? '已核对 ✓' : (item.isIssue ? (item.why ? (item.why.length > 7 ? item.why.slice(0, 7) + '…' : item.why) : '待核对') : (item.section || '正常'));
          return `
            <div class="chk-search-item ${tagClass} ${idx === 0 ? 'active' : ''}" data-idx="${idx}" data-head="${esc(item.head)}">
              <span>${item.isSub ? '📌' : '📑'} <b>${esc(item.qNo || item.head)}</b> <small style="color:var(--mute,#64748b);font-size:11px">${esc(item.label !== item.qNo ? item.label : '')}</small></span>
              <span class="q-tag">${esc(tagText)}</span>
            </div>
          `;
        }).join('');
      activeIdx = 0;
      drop.classList.add('on');
      return;
    }

    const qClean = raw.replace(/^第\s*/, '').replace(/^习题\s*/i, '').replace(/\s*题$/, '').trim();
    const qNumMatch = raw.match(/(?:习题)?\s*(\d+(?:\.\d+)?|\d+)/i);
    const qNum = qNumMatch ? qNumMatch[1] : qClean;

    const qLow = raw.toLowerCase();
    const qCleanLow = qClean.toLowerCase();
    const norm = s => s.replace(/[\s\-_()（）[\]【】]/g, '').toLowerCase();
    const qNorm = norm(raw);
    const qCleanNorm = norm(qClean);

    const exact = [];
    const prefix = [];
    const contains = [];

    all.forEach(item => {
      const hLow = item.head.toLowerCase();
      const qnLow = (item.qNo || '').toLowerCase();
      const hNorm = norm(item.head);
      const qnNorm = norm(item.qNo || '');

      const isExact = (qnLow && (qnLow === qLow || qnLow === qCleanLow || qnLow === qNum)) ||
                      hLow === qLow || hLow === qCleanLow ||
                      (qnNorm && (qnNorm === qNorm || qnNorm === qCleanNorm)) ||
                      hNorm === qNorm || hNorm === qCleanNorm;

      const isPrefix = !isExact && ((qnLow && (qnLow.startsWith(qLow) || qnLow.startsWith(qCleanLow) || (qNum && qnLow.startsWith(qNum)))) ||
                                    hLow.startsWith(qLow) || hLow.startsWith(qCleanLow) ||
                                    (qnNorm && (qnNorm.startsWith(qNorm) || qnNorm.startsWith(qCleanNorm))) ||
                                    hNorm.startsWith(qNorm) || hNorm.startsWith(qCleanNorm));

      const isContains = !isExact && !isPrefix && (hLow.includes(qLow) || hLow.includes(qCleanLow) || hNorm.includes(qNorm) || hNorm.includes(qCleanNorm));

      if (isExact) exact.push(item);
      else if (isPrefix) prefix.push(item);
      else if (isContains) contains.push(item);
    });

    curMatches = [...exact, ...prefix, ...contains].slice(0, 20);

    const hasExact = exact.length > 0;
    const newHead = (qNum || qClean || raw).replace(/^#{1,6}\s*/, '').trim();

    let itemsHtml = '';
    // 如果没有精确匹配，在最顶部生成醒目的“+ 新建题目”入口
    if (!hasExact && newHead) {
      itemsHtml += `
        <div class="chk-search-item new-q ${curMatches.length === 0 ? 'active' : ''}" data-idx="new" data-head="${esc(newHead)}">
          <span>✨ <b>+ 新建题目 ${esc(newHead)}</b> <small style="color:var(--mute,#64748b);font-size:11px">智能插入对应章节位置</small></span>
          <span class="q-tag" style="background:#e0e7ff;color:#4338ca;font-weight:700">新建题</span>
        </div>
      `;
    }

    if (curMatches.length) {
      itemsHtml += curMatches.map((item, idx) => {
        const tagClass = item.isDone ? 'done' : (item.isIssue ? 'bad' : '');
        const tagText = item.isDone ? '已核对 ✓' : (item.isIssue ? (item.why ? (item.why.length > 7 ? item.why.slice(0, 7) + '…' : item.why) : '待核对') : (item.section || '正常'));
        const isAct = hasExact ? (idx === 0) : false;
        return `
          <div class="chk-search-item ${tagClass} ${isAct ? 'active' : ''}" data-idx="${idx}" data-head="${esc(item.head)}">
            <span>${item.isSub ? '📌' : '📑'} <b>${esc(item.qNo || item.head)}</b> <small style="color:var(--mute,#64748b);font-size:11px">${esc(item.label !== item.qNo ? item.label : '')}</small></span>
            <span class="q-tag">${esc(tagText)}</span>
          </div>
        `;
      }).join('');
    }

    if (!itemsHtml) {
      drop.innerHTML = `<div class="chk-search-tip">无匹配题号 “${esc(raw)}”</div>`;
    } else {
      drop.innerHTML = itemsHtml;
      activeIdx = (!hasExact && newHead) ? 0 : 0;
    }
    drop.classList.add('on');
  };

  const doJump = (targetHead, forceNew) => {
    let head = targetHead;
    let willCreate = !!forceNew;

    if (!head) {
      const q = input.value.trim();
      if (!q) { shake('请输入题号'); return; }
      const actEl = drop.querySelector('.chk-search-item.active');
      if (actEl) {
        head = actEl.dataset.head;
        if (actEl.dataset.idx === 'new' || actEl.classList.contains('new-q')) willCreate = true;
      } else if (curMatches.length) {
        head = curMatches[0].head;
      } else {
        head = q.replace(/^#{1,6}\s*/, '').trim();
        willCreate = true;
      }
    }

    if (!head) { shake('未找到题号'); return; }

    const t = normText();
    // 若指定新建或全文尚无该题，自动创建并插入
    if (willCreate || !blockRange(t, head)) {
      createNewQuestion(head);
      input.value = head;
      wrap.classList.add('has-val');
      closeDrop();
      return;
    }

    try {
      if (typeof window.openEditor === 'function') {
        window.openEditor(head, 'src');
      } else {
        openEditor(head, 'src');
      }
      input.value = head;
      wrap.classList.add('has-val');
      closeDrop();
      const st = $('edStatus');
      if (st) {
        st.innerHTML = `<span class="ok">已调出 ${esc(head)} 题 · 在此修改将自动保存并实时写回全文 ✓</span>`;
      }
    } catch (e) {
      shake(e.message || '调出失败');
    }
  };

  input.addEventListener('focus', () => {
    renderDrop();
    setTimeout(() => { try { input.select(); } catch (_) {} }, 0);
  });

  input.addEventListener('input', () => {
    wrap.classList.toggle('has-val', !!input.value);
    renderDrop();
  });

  input.addEventListener('keydown', e => {
    const items = Array.from(drop.querySelectorAll('.chk-search-item'));
    let curr = items.findIndex(it => it.classList.contains('active'));

    if (e.key === 'Enter') {
      e.preventDefault();
      if (curr >= 0 && items[curr]) {
        const it = items[curr];
        doJump(it.dataset.head, it.dataset.idx === 'new' || it.classList.contains('new-q'));
      } else {
        doJump();
      }
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (!items.length) return;
      if (curr >= 0) items[curr].classList.remove('active');
      curr = (curr + 1) % items.length;
      items[curr].classList.add('active');
      items[curr].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (!items.length) return;
      if (curr >= 0) items[curr].classList.remove('active');
      curr = (curr - 1 + items.length) % items.length;
      items[curr].classList.add('active');
      items[curr].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Escape') {
      closeDrop();
      input.blur();
    }
  });

  drop.addEventListener('click', e => {
    const it = e.target.closest('.chk-search-item');
    if (!it) return;
    const isNew = it.dataset.idx === 'new' || it.classList.contains('new-q');
    doJump(it.dataset.head, isNew);
  });

  clearBtn.addEventListener('click', () => {
    input.value = '';
    wrap.classList.remove('has-val');
    input.focus();
    renderDrop();
  });

  goBtn.addEventListener('click', () => doJump());
  icBtn.addEventListener('click', () => {
    if (!input.value.trim()) {
      input.focus();
      renderDrop();
    } else {
      doJump();
    }
  });

  document.addEventListener('click', e => {
    if (!wrap.contains(e.target)) closeDrop();
  });
}

// 页面加载就绪后初始化核对栏题号跳转放大镜
mountCheckHeadingSearch();

try { localStorage.removeItem('ed_mods_visible'); } catch (_) {}
</script>

<script src="./md_nav.js"></script>
<script src="./md_projects.js"></script>
